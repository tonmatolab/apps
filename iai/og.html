<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&family=Shippori+Mincho:wght@800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0d0b0a; color: #f6ece0; position: relative; font-family: "M PLUS Rounded 1c", sans-serif; }
  img { position: absolute; right: 0; top: 0; width: 640px; height: 630px; object-fit: cover; object-position: center 30%; }
  .fade { position: absolute; right: 0; top: 0; width: 640px; height: 630px; background: linear-gradient(90deg, #0d0b0a, transparent 40%); }
  .txt { position: absolute; left: 70px; top: 120px; }
  .k { display: inline-block; background: #e3342a; color: #fff; font-size: 34px; padding: 4px 22px; border-radius: 99px; }
  h1 { font-family: "Shippori Mincho", serif; font-size: 150px; line-height: 1.1; margin: 20px 0 0; letter-spacing: .06em; }
  p { font-size: 38px; margin: 18px 0 0; color: #f0b429; }
</style>
</head>
<body>
  <img src="img/ready.jpg" alt="">
  <div class="fade"></div>
  <div class="txt">
    <span class="k">反射神経テスト</span>
    <h1>居合斬り</h1>
    <p>あなたは全国上位何%？</p>
  </div>
</body>
</html>
