<!doctype html>
<html lang="ja"><head><meta charset="utf-8">

<style>

  img { position: absolute; right: 70px; top: 85px; width: 460px; height: 460px; border-radius: 48px; border: 8px solid #fff; box-shadow: 0 24px 50px -10px rgba(0,0,0,.45); object-fit: cover; }
