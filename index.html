<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>とんまとラボ｜登録なしで遊べる、へんなゲームたち</title>
<meta name="description" content="ひとりでも、友達とでも。登録なし・無料でブラウザから遊べるゲームと診断。名将ガチャ、サッカー人生、リバーシ部屋など。">
<meta property="og:type" content="website">
<meta property="og:title" content="とんまとラボ🍅 登録なしで遊べる、へんなゲームたち">
<meta property="og:description" content="名将ガチャ、サッカー人生、リバーシ部屋…ひとりでも友達とでも、ぜんぶ無料・登録なし">
<meta property="og:image" content="https://tonmatolab.github.io/apps/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#fff4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2a2030" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff4f7; --dot: #ffdfe8; --card: #fffdfb; --ink: #4d3340; --sub: #9c7b8b; --soft: #fbe9ee;
    --line: #4d3340; --shade: #f4bccb;
    --pink: #ff7aa2; --pink-l: #ffe1ea; --pink-d: #d9426f;
    --yellow: #ffd65c; --yellow-l: #fff1b8; --yellow-d: #7a5200;
    --red: #ff6b5e;
    --pop: "Mochiy Pop One", "Zen Maru Gothic", system-ui, sans-serif;
    --latin: "Fredoka", system-ui, sans-serif; --ja: "Zen Maru Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #2a2030; --dot: #362a3e; --card: #382c40; --ink: #fff0f5; --sub: #c9adbd; --soft: #2f2436;
      --line: #f6dbe6; --shade: #17111b; --yellow-l: #5a4a1c; }
  }
  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  body { margin: 0; color: var(--ink); font-family: var(--ja); line-height: 1.6; -webkit-font-smoothing: antialiased;
    background: var(--bg) radial-gradient(var(--dot) 2.5px, transparent 3px) 0 0 / 24px 24px; }
  main { max-width: 600px; margin: 0 auto; padding: 0 18px 56px; }
  a { color: inherit; text-decoration: none; }

  /* ヘッダー */
  .top { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .wm { font-family: var(--latin); font-weight: 700; font-size: 1.1rem; letter-spacing: .06em; }
  .wm span { color: var(--pink); }
  .top small { font-family: var(--latin); font-size: .7rem; font-weight: 600; letter-spacing: .1em; padding: 3px 12px; border-radius: 99px;
    background: var(--card); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--shade); }

  /* ヒーロー */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 20px 0 6px; }
  .eyebrow { margin: 0 0 12px; display: inline-block; font-family: var(--latin); font-size: .72rem; font-weight: 600; letter-spacing: .1em; color: var(--pink-d); }
  .eyebrow::before { content: '✦ '; color: var(--yellow); }
  h1 { margin: 0; font-family: var(--pop); font-weight: 400; font-size: clamp(1.45rem, 6.6vw, 2.4rem); line-height: 1.4; }
  h1 em { font-style: normal; color: var(--pink); background: linear-gradient(transparent 64%, var(--yellow-l) 0); padding: 0 2px; }
  h1 .nw { white-space: nowrap; display: inline-block; }
  .lead { margin: 12px 0 0; color: var(--sub); font-size: .86rem; font-weight: 700; }
  .logo-wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .logo-wrap::before, .logo-wrap::after { position: absolute; pointer-events: none; font-size: 1.1rem; animation: twinkle 2.4s ease-in-out infinite; }
  .logo-wrap::before { content: '✦'; left: -10px; top: -6px; color: var(--yellow); }
  .logo-wrap::after { content: '♡'; right: -10px; top: 52px; color: var(--pink); animation-delay: 1.2s; }
  @keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.25) rotate(12deg); } }
  .logo { position: relative; width: 92px; height: 92px; padding: 5px; border: 2.5px solid var(--line); border-radius: 50%; background: var(--card); cursor: pointer;
    box-shadow: 0 5px 0 var(--shade); touch-action: manipulation; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; transition: box-shadow .12s, transform .12s; }
  .logo:active { box-shadow: 0 1px 0 var(--shade); transform: translateY(4px); }
  .logo img { width: 100%; height: 100%; border-radius: 50%; display: block; pointer-events: none; }
  .logo .press { position: absolute; inset: -7px; border-radius: 50%; border: 3px solid var(--pink); opacity: 0; pointer-events: none;
    -webkit-mask: conic-gradient(#000 var(--p, 0%), transparent 0); mask: conic-gradient(#000 var(--p, 0%), transparent 0); }
  .logo.holding .press { opacity: 1; }
  .hint { font-size: .66rem; font-weight: 700; color: var(--sub); white-space: nowrap; display: flex; align-items: center; gap: 4px; }
  .hint::before { content: '☝'; display: inline-block; animation: poke 1.6s ease-in-out infinite; }
  @keyframes poke { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-3px); } }
  .hint.gone { opacity: 0; transition: opacity .6s; }

  /* 数字：パステルの丸いふせん */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 24px 0 0; }
  .stats div { border-radius: 20px; padding: 10px 4px 8px; text-align: center; border: 2px solid var(--line); box-shadow: 0 4px 0 var(--shade); }
  .stats div:nth-child(1) { background: #ffe1ea; color: #c93a66; }
  .stats div:nth-child(2) { background: #ebe4ff; color: #5d43c9; }
  .stats div:nth-child(3) { background: #d8f4ea; color: #16876b; }
  .stats b { display: block; font-family: var(--latin); font-weight: 600; font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stats span { display: block; margin-top: 3px; font-size: .64rem; font-weight: 700; }

  .install { display: none; margin: 18px auto 0; font: inherit; font-weight: 700; font-size: .76rem; border: 2px solid var(--line); border-radius: 99px; padding: 7px 18px; cursor: pointer;
    color: #fff; background: var(--pink); box-shadow: 0 4px 0 var(--shade); }
  .install:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shade); }
  .install.on { display: block; }
  #iosTip { display: none; margin: 10px 0 0; font-size: .76rem; color: var(--sub); text-align: center; }

  .pick { margin: 24px 0 0; }
  .pick .tile { display: flex; }

  /* ジャンル札 */
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 36px 0 0; }
  .chip { font-size: .8rem; font-weight: 900; color: var(--cd); background: var(--c); padding: 6px 15px; border-radius: 99px;
    border: 2px solid var(--line); box-shadow: 0 3px 0 var(--shade); }
  .chip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shade); }

  /* 遊び方ごとの棚（横スクロール） */
  .shelf { margin: 32px 0 0; scroll-margin-top: 16px; }
  .shelf-h { display: flex; align-items: center; gap: 10px; margin: 0 0 2px; }
  .shelf-h h2 { margin: 0; font-family: var(--pop); font-weight: 400; font-size: 1.22rem; line-height: 1.4; }
  .shelf-h h2::before { content: ''; display: inline-block; width: 13px; height: 13px; margin-right: 9px; border-radius: 50%; background: var(--c); border: 2px solid var(--cd); vertical-align: .05em; }
  .shelf-h h2 small { margin-left: 8px; font-family: var(--latin); font-weight: 600; font-size: .7rem; letter-spacing: .08em; color: var(--cd); }
  .shelf-h span { margin-left: auto; font-family: var(--latin); font-size: .74rem; font-weight: 600; color: var(--cd); background: var(--c); padding: 1px 11px; border-radius: 99px; }
  .row { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
    margin: 0 -18px; padding: 10px 18px 16px; scroll-padding: 0 18px; scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  .row .tile { flex: 0 0 78%; scroll-snap-align: start; }
  .row .tile:only-child { flex-basis: 100%; }
  @media (min-width: 560px) { .row .tile { flex-basis: 44%; } }
  /* 重力ギミック中は棚からはみ出して落ちられるように */
  .gravity .row { overflow: visible; }
  /* カード：ふちどりステッカー */
  .tile { position: relative; display: flex; flex-direction: column; background: var(--card); border-radius: 24px; padding: 7px; border: 2px solid var(--line);
    box-shadow: 0 5px 0 var(--shade); transition: transform .12s, box-shadow .12s; }
  .tile:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shade); }
  .tile .ph { position: relative; aspect-ratio: 1200 / 630; overflow: hidden; border-radius: 18px; background: var(--soft); }
  .tile .ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
  .tile:hover .ph img { transform: scale(1.04); }
  .tile .body { display: flex; flex-direction: column; gap: 3px; flex: 1; padding: 9px 7px 4px; }
  .tile .meta { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; font-size: .64rem; font-weight: 700; }
  .tile .meta .tag { padding: 1px 9px; border-radius: 99px; background: var(--c, var(--pink-l)); color: var(--cd, var(--pink-d)); }
  .tile .meta .new { font-family: var(--latin); font-weight: 600; letter-spacing: .06em; color: var(--yellow-d); background: var(--yellow); padding: 1px 8px; border-radius: 99px; }
  .tile .t { font-weight: 900; font-size: .92rem; line-height: 1.4; }
  .tile .d { font-size: .73rem; font-weight: 500; color: var(--sub); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile .foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 8px; font-family: var(--latin); font-size: .72rem; font-weight: 500; color: var(--sub); }
  .tile .foot i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--latin); font-weight: 700;
    background: var(--c, var(--pink-l)); color: var(--cd, var(--pink-d)); }
  .tile.wide .t { font-size: 1.2rem; }
  .tile.wide .d { font-size: .8rem; }
  .tile.wide .hot { position: absolute; left: 10px; top: 10px; font-family: var(--latin); font-size: .7rem; font-weight: 600; letter-spacing: .06em; padding: 2px 12px;
    border-radius: 99px; background: var(--yellow); color: #4d3340; border: 2px solid #4d3340; }
  .tile.wide .hot::before { content: '♛ '; }
  .tile.wide .hot b { font-weight: 700; color: #d9426f; }

  footer { margin-top: 44px; text-align: center; font-size: .74rem; font-weight: 700; color: var(--sub); }
  footer b { font-family: var(--latin); font-weight: 700; letter-spacing: .06em; color: var(--ink); }
  footer .xline { margin: 10px 0 0; font-weight: 500; line-height: 1.6; }
  footer .xline a { color: var(--ink); font-weight: 800; }

  /* スクロールでぷにっと出る */
  .rv { opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .6s ease, transform .7s cubic-bezier(.3,1.5,.5,1); }
  .rv.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .rv { opacity: 1; transform: none; transition: none; } .hint::before, .logo-wrap::before, .logo-wrap::after { animation: none; } }

  /* ギミック：トマト */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
  .splat { position: absolute; pointer-events: none; z-index: 5; width: 74px; height: 74px; margin: -37px 0 0 -37px; animation: splatIn .18s ease-out both; }
  .splat.out { transition: opacity 1.2s; opacity: 0; }
  @keyframes splatIn { from { transform: scale(.2) rotate(var(--r)); } to { transform: scale(1) rotate(var(--r)); } }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { translate: -3px 1px; } 50% { translate: 3px -1px; } 75% { translate: -2px 0; } }
  .toast { position: fixed; left: 50%; bottom: 28px; z-index: 60; transform: translate(-50%, 20px); opacity: 0; transition: .3s; pointer-events: none;
    background: var(--ink); color: var(--bg); font-size: .8rem; font-weight: 700; padding: 10px 18px; border-radius: 99px; white-space: nowrap; }
  .toast.on { transform: translate(-50%, 0); opacity: 1; }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main>
  <header class="top">
    <div class="wm">TONMATO <span>LAB</span></div>
    <small>WEB GAMES</small>
  </header>

  <section class="hero">
    <div>
      <p class="eyebrow fall">FREE · NO SIGN-UP · IN BROWSER</p>
      <h1 class="fall"><span class="nw">くだらないことに、</span><br><span class="nw"><em>全力</em>で。</span></h1>
      <p class="lead fall">ひとりでも、友達とでも。<br>登録なし・無料で遊べます。</p>
    </div>
    <div class="logo-wrap fall">
      <button class="logo" id="logo" aria-label="とんまと"><span class="press"></span><img src="icons/icon-192.png" alt="" draggable="false"></button>
      <span class="hint" id="hint">タップしてみて</span>
    </div>
  </section>

  <div class="stats">
    <div class="fall"><b id="players">–</b><span>遊んだ人</span></div>
    <div class="fall"><b id="views">–</b><span>このページの閲覧</span></div>
    <div class="fall"><b id="count">–</b><span>アプリ</span></div>
  </div>

  <div class="pick" id="pick"></div>

  <button class="install" id="installBtn">ホーム画面に追加して、いつでも遊ぶ</button>
  <p id="iosTip">iPhoneは、共有ボタン →「ホーム画面に追加」で追加できます</p>

  <nav class="chips" id="chips" aria-label="ジャンル"></nav>
  <div id="shelves"></div>

  <footer class="fall"><b>TONMATO LAB</b> 🍅 新しいゲームを続々公開中<p class="xline">お問い合わせ・ご意見・不具合の報告は<br>X（旧Twitter）<a href="https://x.com/tonmatolab" target="_blank" rel="noopener">@tonmatolab</a> へどうぞ</p><p class="xline"><a href="policy/">運営者情報・プライバシーポリシー・広告について</a></p></footer>
</main>
<div class="toast" id="toast"></div>
<script src="shared/apps.js"></script>
<script>
const API = 'https://tonmatolab-counter.tonmatolab.workers.dev';
const APPS = window.TONMATO_APPS;
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString();
// 一覧の棚。各アプリの shelf（shared/apps.js）でどの棚に入るか決まる
const SHELVES = [
  { id: 'friends', label: 'みんなと', title: 'みんなと遊ぶ', en: 'WITH OTHERS', c: '#ebe4ff', cd: '#5d43c9' },
  { id: 'solo', label: 'ひとりで', title: 'ひとりで遊ぶ', en: 'SOLO', c: '#ffe1ea', cd: '#c93a66' },
  { id: 'quiz', label: '診断・クイズ', title: '診断・クイズ', en: 'QUIZ', c: '#d8f4ea', cd: '#16876b' },
];
const NEW_IDS =new Set(APPS.slice().sort((x, y) => new Date(y.added) - new Date(x.added)).slice(0, 2).map((a) => a.id));
async function call(path, method = 'GET') {
  try { const r = await fetch(API + path, { method, signal: AbortSignal.timeout(8000) }); return r.ok ? await r.json() : null; } catch { return null; }
}
function countUp(el, to) {
  const t0 = performance.now(), d = 900;
  const step = (now) => { const k = Math.min(1, (now - t0) / d), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(Math.round(to * e)); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function render(counts) {
  const sorted = APPS.map((a) => ({ a, n: (counts && counts[a.key]) || 0 }))
    .sort((x, y) => y.n - x.n || new Date(y.a.added) - new Date(x.a.added));
  const tile = (x, top) => `<a class="tile rv fall${top ? ' wide' : ''}" href="${x.a.path}">
      <div class="ph"><img src="${x.a.path}og.png" alt="" loading="${top ? 'eager' : 'lazy'}" draggable="false">${top && x.n ? '<span class="hot"><b>No.1</b> POPULAR</span>' : ''}</div>
      <div class="body">
        <div class="meta"><span class="tag">${esc(x.a.tag)}</span>${NEW_IDS.has(x.a.id) ? '<span class="new">NEW</span>' : ''}</div>
        <div class="t">${esc(x.a.title)}</div>
        <div class="d">${esc(x.a.desc)}</div>
        <div class="foot"><span>${x.n ? `${fmt(x.n)} players` : 'new'}</span><i>→</i></div>
      </div></a>`;
  // いちばん遊ばれているアプリを数字の下の特等席に
  $('pick').innerHTML = tile(sorted[0], true);
  // 遊び方ごとの棚。棚の中は遊ばれている順
  $('chips').innerHTML = SHELVES.map((s) => `<a class="chip fall" href="#shelf-${s.id}" style="--c:${s.c};--cd:${s.cd}">${s.label}</a>`).join('');
  $('shelves').innerHTML = SHELVES.map((s) => {
    const items = sorted.filter((x) => (x.a.shelf || 'solo') === s.id);
    if (!items.length) return '';
    return `<section class="shelf" id="shelf-${s.id}" style="--c:${s.c};--cd:${s.cd}">
      <div class="shelf-h fall"><h2>${s.title}<small>${s.en}</small></h2><span>${items.length}</span></div>
      <div class="row">${items.map((x) => tile(x, false)).join('')}</div></section>`;
  }).join('');
  $('count').textContent = APPS.length;
  if (counts) countUp($('players'), sorted.reduce((s, x) => s + x.n, 0));
  observe();
}
// スクロールでふわっと出す
const io = 'IntersectionObserver' in window ? new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' }) : null;
function observe() { document.querySelectorAll('.rv:not(.in)').forEach((el, i) => { el.style.transitionDelay = `${(i % 2) * 70}ms`; io ? io.observe(el) : el.classList.add('in'); }); }

render(null);
(async () => {
  // 手元での確認中は閲覧数を増やさない
  const v = LOCAL ? await call('/get?keys=portal-view').then((j) => j && { value: j['portal-view'] }) : await call('/hit/portal-view', 'POST');
  if (v) countUp($('views'), v.value);
  // 全アプリの人数は1時間使い回す（各アプリの「次はこれで遊ぼう」＝ shared/next.js と共通の入れ物）
  let j = null;
  try { const c = JSON.parse(localStorage.getItem('tn-counts') || 'null'); if (c && Date.now() - c.t < 3600000) j = c.j; } catch {}
  if (!j) { j = await call('/get?keys=' + APPS.map((a) => a.key).join(',')); if (j) try { localStorage.setItem('tn-counts', JSON.stringify({ t: Date.now(), j })); } catch {} }
  if (j) render(j);
})();

// ホーム画面に追加
let deferred = null;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; if (!standalone) $('installBtn').classList.add('on'); });
$('installBtn').onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $('installBtn').classList.remove('on'); };
if (!standalone && /iPhone|iPad|iPod/.test(navigator.userAgent)) $('iosTip').style.display = 'block';
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

// ===== 隠しギミック =====
function toast(msg, ms = 2400) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('on'), ms); }
let actx = null;
function snd(kind) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const a = actx, t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    if (kind === 'pop') { o.frequency.setValueAtTime(620, t); o.frequency.exponentialRampToValueAtTime(240, t + .09); g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .1); }
    else if (kind === 'splat') { o.type = 'triangle'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(50, t + .16); g.gain.setValueAtTime(.22, t); g.gain.exponentialRampToValueAtTime(.001, t + .18); }
    else { o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + .35); g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + .4); }
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + .45);
  } catch {}
}

// --- ② トマト投げ：ロゴをタップするとトマトが飛び出し、カードに当たるとペチャッ ---
const cv = $('fx'), cx = cv.getContext('2d');
let VW = 0, VH = 0;
function fit() { const dpr = Math.min(devicePixelRatio || 1, 2); VW = innerWidth; VH = innerHeight; cv.width = VW * dpr; cv.height = VH * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); }
fit(); addEventListener('resize', fit);
const tomatoes = [];
let fxRaf = 0, fxLast = 0;
let throws = 0;
function throwTomato() {
  throws++;
  const h = $('hint');
  if (throws === 3) h.textContent = '長押しもしてみて';
  if (throws === 12) h.classList.add('gone');
  const r = $('logo').getBoundingClientRect();
  tomatoes.push({ x: r.left + r.width / 2, y: r.top + r.height / 2, vx: -150 - Math.random() * 520, vy: -620 - Math.random() * 520,
    r: 11 + Math.random() * 7, rot: 0, vr: (Math.random() - .5) * 14, t: 0, bounces: 0 });
  snd('pop'); if (navigator.vibrate) navigator.vibrate(8);
  if (!fxRaf) { fxLast = performance.now(); fxRaf = requestAnimationFrame(fxLoop); }
}
function drawTomato(o) {
  cx.save(); cx.translate(o.x, o.y); cx.rotate(o.rot);
  const g = cx.createRadialGradient(-o.r * .35, -o.r * .35, o.r * .1, 0, 0, o.r);
  g.addColorStop(0, '#ff7a5c'); g.addColorStop(.6, '#e8432f'); g.addColorStop(1, '#b52a1a');
  cx.fillStyle = g; cx.beginPath(); cx.ellipse(0, 0, o.r, o.r * .9, 0, 0, Math.PI * 2); cx.fill();
  cx.fillStyle = '#3f9b3a';
  for (let k = 0; k < 5; k++) { cx.save(); cx.rotate(k * Math.PI * 2 / 5); cx.beginPath(); cx.ellipse(0, -o.r * .78, o.r * .16, o.r * .38, 0, 0, Math.PI * 2); cx.fill(); cx.restore(); }
  cx.fillStyle = 'rgba(255,255,255,.55)'; cx.beginPath(); cx.ellipse(-o.r * .38, -o.r * .3, o.r * .18, o.r * .11, -.6, 0, Math.PI * 2); cx.fill();
  cx.restore();
}
const SPLAT = (c) => `<svg viewBox="-40 -40 80 80" xmlns="http://www.w3.org/2000/svg"><g fill="${c}">
  <path d="M0-24C9-24 11-14 18-16S30-8 24 0 30 14 18 15 9 26 0 22-12 28-17 17-30 12-24 2-30-12-17-14-9-24 0-24Z"/>
  <circle cx="29" cy="-21" r="4"/><circle cx="-31" cy="19" r="3.5"/><circle cx="7" cy="33" r="3"/><circle cx="-24" cy="-27" r="2.5"/></g>
  <path d="M-9-10C-4-15 4-15 7-11" stroke="rgba(255,255,255,.5)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g fill="#3f9b3a"><ellipse cx="-3" cy="-2" rx="3" ry="6" transform="rotate(30)"/><ellipse cx="3" cy="-2" rx="3" ry="6" transform="rotate(-40)"/></g></svg>`;
function splatOn(tile, x, y) {
  const r = tile.getBoundingClientRect();
  const s = document.createElement('div'); s.className = 'splat';
  s.style.left = `${x - r.left}px`; s.style.top = `${y - r.top}px`; s.style.setProperty('--r', `${Math.random() * 360}deg`);
  s.innerHTML = SPLAT('#e8432f'); tile.appendChild(s);
  tile.classList.remove('shake'); void tile.offsetWidth; tile.classList.add('shake');
  snd('splat'); if (navigator.vibrate) navigator.vibrate(18);
  setTimeout(() => s.classList.add('out'), 4500); setTimeout(() => s.remove(), 5800);
}
function fxLoop(now) {
  const dt = Math.min(.033, (now - fxLast) / 1000); fxLast = now;
  cx.clearRect(0, 0, VW, VH);
  const tiles = [...document.querySelectorAll('.tile')].map((el) => ({ el, r: el.getBoundingClientRect() }));
  for (let i = tomatoes.length - 1; i >= 0; i--) {
    const o = tomatoes[i];
    o.t += dt; o.vy += 2100 * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.rot += o.vr * dt;
    if (o.x < o.r) { o.x = o.r; o.vx *= -.6; } if (o.x > VW - o.r) { o.x = VW - o.r; o.vx *= -.6; }
    let gone = false;
    if (o.t > .18 && o.vy > 0) {
      const hit = tiles.find((T) => o.x > T.r.left + 6 && o.x < T.r.right - 6 && o.y > T.r.top + 4 && o.y < T.r.bottom - 4);
      if (hit) { splatOn(hit.el, o.x, o.y); gone = true; }
    }
    if (!gone && o.y > VH - o.r) { o.y = VH - o.r; o.vy *= -.42; o.vx *= .7; o.bounces++; if (o.bounces > 2) gone = true; }
    if (gone) tomatoes.splice(i, 1); else drawTomato(o);
  }
  fxRaf = tomatoes.length ? requestAnimationFrame(fxLoop) : 0;
  if (!fxRaf) cx.clearRect(0, 0, VW, VH);
}

// --- ⑥ トマト重力：ロゴを長押しすると、画面の中身がぜんぶ落ちる ---
let G = null;
function gravityOn() {
  if (G) return;
  $('hint').classList.add('gone');
  snd('thud'); if (navigator.vibrate) navigator.vibrate([30, 40, 60]);
  document.documentElement.style.overflow = 'hidden';
  document.body.classList.add('gravity');
  const bodies = [...document.querySelectorAll('.fall')].map((el) => {
    const r = el.getBoundingClientRect();
    if (r.bottom < 0 || r.top > VH) return null;
    el.style.transition = 'none'; el.style.willChange = 'transform';
    return { el, x: r.left, y: r.top, w: r.width, h: r.height, dx: 0, dy: 0, vx: (Math.random() - .5) * 120, vy: -Math.random() * 260,
      rot: 0, vr: (Math.random() - .5) * 3, landed: false, delay: Math.random() * .18 };
  }).filter(Boolean).sort((a, b) => b.y - a.y);
  G = { bodies, t: 0, last: performance.now(), raf: 0, ready: false };
  setTimeout(() => { if (G) { G.ready = true; toast('タップするか、スマホを振ると元に戻ります', 3200); } }, 900);
  G.raf = requestAnimationFrame(gLoop);
}
function gLoop(now) {
  if (!G) return;
  const dt = Math.min(.033, (now - G.last) / 1000); G.last = now; G.t += dt;
  const floor0 = VH - 6;
  for (const b of G.bodies) {
    if (G.t < b.delay) continue;
    if (!b.landed) {
      b.vy += 2600 * dt; b.dx += b.vx * dt; b.dy += b.vy * dt; b.rot += b.vr * dt;
      const left = b.x + b.dx, right = left + b.w;
      if (left < 0) { b.dx = -b.x; b.vx = Math.abs(b.vx) * .5; } if (right > VW) { b.dx = VW - b.w - b.x; b.vx = -Math.abs(b.vx) * .5; }
      // 先に落ちたものの上に積み重なる
      let floor = floor0;
      for (const o of G.bodies) if (o !== b && o.landed && left < o.x + o.dx + o.w - 10 && right > o.x + o.dx + 10) floor = Math.min(floor, o.y + o.dy + o.h * .18);
      if (b.y + b.dy + b.h > floor && b.vy > 0) {
        b.dy = floor - b.h - b.y;
        if (b.vy > 420) { b.vy *= -.28; b.vr *= .5; } else { b.landed = true; b.vy = 0; b.rot = Math.max(-.35, Math.min(.35, b.rot)); }
      }
    }
    b.el.style.transform = `translate(${b.dx}px, ${b.dy}px) rotate(${b.rot}rad)`;
  }
  G.raf = requestAnimationFrame(gLoop);
}
function gravityOff() {
  if (!G || !G.ready) return;
  cancelAnimationFrame(G.raf);
  const bodies = G.bodies; G = null; $('toast').classList.remove('on');
  snd('pop');
  for (const b of bodies) { b.el.style.transition = 'transform .8s cubic-bezier(.3,1.4,.5,1)'; b.el.style.transform = ''; }
  setTimeout(() => { for (const b of bodies) { b.el.style.transition = ''; b.el.style.willChange = ''; } document.documentElement.style.overflow = ''; document.body.classList.remove('gravity'); }, 850);
}
// 落ちている間のタップは、リンクを開かずに元に戻すだけ
document.addEventListener('click', (e) => { if (G) { e.preventDefault(); e.stopPropagation(); gravityOff(); } }, true);
addEventListener('devicemotion', (e) => { const a = e.accelerationIncludingGravity || e.acceleration; if (G && a && Math.hypot(a.x || 0, a.y || 0, a.z || 0) > 24) gravityOff(); });

// ロゴ：タップでトマト、長押しで重力
const logo = $('logo');
let hold = null;
logo.addEventListener('contextmenu', (e) => e.preventDefault());
logo.addEventListener('pointerdown', (e) => {
  if (G) return;
  e.preventDefault();
  const t0 = performance.now();
  hold = { fired: false, raf: 0 };
  logo.classList.add('holding');
  const tick = () => {
    if (!hold) return;
    const p = Math.min(1, (performance.now() - t0 - 180) / 520);
    logo.style.setProperty('--p', `${Math.max(0, p) * 100}%`);
    if (p >= 1 && !hold.fired) { hold.fired = true; logo.classList.remove('holding'); gravityOn(); return; }
    hold.raf = requestAnimationFrame(tick);
  };
  hold.raf = requestAnimationFrame(tick);
});
const release = () => {
  if (!hold) return;
  cancelAnimationFrame(hold.raf);
  if (!hold.fired) throwTomato();
  hold = null; logo.classList.remove('holding'); logo.style.setProperty('--p', '0%');
};
logo.addEventListener('pointerup', release);
logo.addEventListener('pointerleave', () => { if (hold && !hold.fired) { cancelAnimationFrame(hold.raf); hold = null; logo.classList.remove('holding'); logo.style.setProperty('--p', '0%'); } });
logo.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); throwTomato(); } });
</script>
</body>
</html>
