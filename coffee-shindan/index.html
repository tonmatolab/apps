// ===== 質問（各選択肢がタイプに加点） =====

  { icon: '⏰', q: '朝起きて、まず何をする？', a: [['すぐ起きて動き出す', { espresso: 2 }], ['しばらく布団でゴロゴロ', { latte: 2, decaf: 1 }], ['いつものルーティンをこなす', { drip: 2 }], ['その日の気分で決める', { cold: 2, fruity: 1 }]] },

    s += `<path d="M70 140 L170 140 L162 194 Q120 206 78 194 Z" fill="#fff" ${L}/><ellipse cx="120" cy="142" rx="50" ry="9" fill="#4a2512" ${L}/>`;
    s += `<path d="M40 160 q10 -30 40 -26" fill="none" stroke="#c0632a" stroke-width="6" stroke-linecap="round"/><path d="M28 168 q4 -10 12 -8" fill="none" ${L}/>`;
  } else if (id === 'cold') {
    s += `<path d="M76 46 L164 46 L152 200 Q120 210 88 200 Z" fill="#dff1ff" ${L}/>`;
    s += `<path d="M80 86 L160 86 L152 198 Q120 206 88 198 Z" fill="#4a2512"/>`;
    s += `<rect x="96" y="96" width="26" height="24" rx="5" fill="#e9f7ff" opacity=".85" transform="rotate(-12 109 108)"/><rect x="124" y="118" width="24" height="22" rx="5" fill="#e9f7ff" opacity=".85" transform="rotate(14 136 129)"/><rect x="100" y="140" width="22" height="20" rx="5" fill="#e9f7ff" opacity=".7"/>`;
    s += `<path d="M138 20 L126 150" stroke="#2f7aa8" stroke-width="9" stroke-linecap="round"/><path d="M138 20 L126 150" stroke="#8fd3ff" stroke-width="4" stroke-linecap="round"/>`;
    s += `<path d="M80 60 q4 40 0 80" stroke="#fff" stroke-width="5" opacity=".6" fill="none" stroke-linecap="round"/>`;
    s += `<path d="M178 70 l6 -12 l6 12 l-6 12 Z M188 104 l4 -8 l4 8 l-4 8 Z" fill="#fff"/>`;
  } else if (id === 'decaf') {

    s += `<text x="96" y="88" font-family="Dela Gothic One" font-size="22" fill="#fff" opacity=".9">z</text><text x="112" y="72" font-family="Dela Gothic One" font-size="28" fill="#fff" opacity=".9">z</text>`;
    s += `<path d="M60 100 L176 100 L168 188 Q118 204 68 188 Z" fill="#4a4f8a" ${L}/>`;
    s += `<path d="M174 116 q32 2 28 30 q-4 24 -36 20" fill="none" ${L} stroke-width="10"/><path d="M174 116 q32 2 28 30 q-4 24 -36 20" fill="none" stroke="#4a4f8a" stroke-width="4"/>`;
    s += `<ellipse cx="118" cy="102" rx="58" ry="12" fill="#7a4a24" ${L}/>`;
    s += `<path d="M98 146 q8 6 16 0 M126 146 q8 6 16 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M110 166 q10 6 20 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`;
  } else if (id === 'fruity') {
    s += steam(112, 84);
    s += `<path d="M62 100 L162 100 L154 180 Q112 196 70 180 Z" fill="#fff" ${L}/>`;
    s += `<path d="M160 114 q30 2 26 28 q-4 22 -34 18" fill="none" ${L} stroke-width="9"/><path d="M160 114 q30 2 26 28 q-4 22 -34 18" fill="none" stroke="#fff" stroke-width="3"/>`;
    s += `<ellipse cx="112" cy="102" rx="50" ry="11" fill="#c46a2c" ${L}/>`;

    s += `<circle cx="180" cy="178" r="2" fill="#ffe08a"/><circle cx="192" cy="186" r="2" fill="#ffe08a"/><circle cx="184" cy="194" r="2" fill="#ffe08a"/>`;
    s += `<circle cx="40" cy="176" r="12" fill="#5a3d9a" ${L} stroke-width="3"/><circle cx="58" cy="186" r="10" fill="#7a5ac0" ${L} stroke-width="3"/>`;

}
// 同じ属性が重なっていると画像として読み込めないので、後に書いたほうだけ残す
function dedupeAttrs(svg) {
  return svg.replace(/<([a-zA-Z]+)((?:\s+[a-zA-Z:-]+="[^"]*")+)\s*(\/?)>/g, (m, name, attrs, slash) => {
    const map = new Map();
    attrs.replace(/([a-zA-Z:-]+)="([^"]*)"/g, (_, k, v) => { map.delete(k); map.set(k, v); return ''; });
    return '<' + name + [...map].map(([k, v]) => ` ${k}="${v}"`).join('') + (slash ? '/' : '') + '>';
  });
}

// ===== 診断ロジック =====
const $ = (id) => document.getElementById(id);
let idx = 0, history_ = [], resultKey = null;
const blankScore = () => Object.fromEntries(Object.keys(TYPES).map((k) => [k, 0]));
function show(id) { ['start', 'quiz', 'result'].forEach((s) => $(s).classList.toggle('hidden', s !== id)); window.scrollTo(0, 0); }
function startQuiz() { idx = 0; history_ = []; show('quiz'); renderQ(); }
function renderQ() {
  const item = QUESTIONS[idx];
  $('bar').style.width = `${(idx / QUESTIONS.length) * 100}%`;
  $('qnum').textContent = `Q${idx + 1}/${QUESTIONS.length}`;
  $('qicon').textContent = item.icon; $('qicon').style.animation = 'none'; void $('qicon').offsetWidth; $('qicon').style.animation = '';
  $('qtext').textContent = item.q;
  $('backBtn').classList.toggle('hidden', idx === 0);
  const box = $('opts'); box.innerHTML = '';
  item.a.forEach(([label, pts], i) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.innerHTML = `<b>${'ABCD'[i]}</b><span></span>`; b.lastChild.textContent = label;
    b.onclick = () => { history_.push(pts); idx++; idx < QUESTIONS.length ? renderQ() : finish(); };
    box.appendChild(b);
  });
}
function finish() {
  const score = blankScore();
  history_.forEach((pts) => { for (const [k, v] of Object.entries(pts)) score[k] += v; });
  // 同点のときは TYPES の定義順で先のものを採用
  resultKey = Object.keys(TYPES).reduce((best, k) => (score[k] > score[best] ? k : best));
  renderResult(resultKey);
  history.replaceState(null, '', `?r=${resultKey}`);
  countPlay();
}
function amazonUrl(q) {
  const u = new URL('https://www.amazon.co.jp/s'); u.searchParams.set('k', q);
  if (AFFILIATE.amazonTag) u.searchParams.set('tag', AFFILIATE.amazonTag);
  return u.toString();
}
function renderResult(key) {
  const t = TYPES[key];
  document.documentElement.style.setProperty('--tc', t.color);
  $('rArt').innerHTML = drinkSVG(key);
  $('rName').textContent = t.name;
  $('rDrink').textContent = t.drink;
  $('rDesc').textContent = t.desc;
  $('rTraits').innerHTML = ''; t.traits.forEach((s) => { const li = document.createElement('li'); li.textContent = s; $('rTraits').appendChild(li); });
  $('rMatch').innerHTML = `<div>${drinkSVG(t.good, { bg: false })}<b>相性◎</b>${TYPES[t.good].name.replace('タイプ', '')}</div><div>${drinkSVG(t.bad, { bg: false })}<b>ちょっと苦手</b>${TYPES[t.bad].name.replace('タイプ', '')}</div>`;
  $('rRec').innerHTML = '';
  t.rec.forEach((r) => {
    const a = document.createElement('a'); a.href = amazonUrl(r.q); a.target = '_blank'; a.rel = 'noopener sponsored';
    a.innerHTML = `<span style="font-size:1.4rem">${r.icon}</span><span></span>`; a.lastChild.textContent = `${r.label} をAmazonで見る →`;
    $('rRec').appendChild(a);
  });
  $('prNote').classList.toggle('hidden', !AFFILIATE.amazonTag);
  show('result');
  imgPromise = null; makeShareImage();
}

// ===== 画像（1080x1350） =====
let imgPromise = null;
function svgImg(svg) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); }); }
function makeShareImage() {
  if (imgPromise) return imgPromise;
  imgPromise = (async () => {
    const t = TYPES[resultKey];
    await Promise.all([document.fonts.load('40px "Dela Gothic One"'), document.fonts.load('800 40px "M PLUS Rounded 1c"')]);
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1350; const g = c.getContext('2d');
    const bg = g.createRadialGradient(540, 420, 60, 540, 520, 900); bg.addColorStop(0, '#fff3e0'); bg.addColorStop(1, t.color);
    g.fillStyle = bg; g.fillRect(0, 0, 1080, 1350);
    g.fillStyle = '#fffaf4'; g.beginPath(); g.roundRect(70, 70, 940, 1210, 60); g.fill();
    const art = await svgImg(drinkSVG(resultKey, { bg: false }));
    g.drawImage(art, 210, 120, 660, 605);
    g.textAlign = 'center'; g.fillStyle = '#8a7262'; g.font = '800 40px "M PLUS Rounded 1c"'; g.fillText('わたしのコーヒータイプは…', 540, 800);
    g.fillStyle = t.color; g.font = '72px "Dela Gothic One"';
    const nm = t.name; if (nm.length > 11) { g.fillText(nm.slice(0, nm.length - 4), 540, 900); g.fillText(nm.slice(nm.length - 4), 540, 990); } else g.fillText(nm, 540, 940);
    g.fillStyle = '#3b2a20'; g.font = '800 40px "M PLUS Rounded 1c"'; g.fillText(t.drink, 540, 1070);
    g.fillStyle = '#8a7262'; g.font = '800 34px "M PLUS Rounded 1c"'; g.fillText(t.traits.map((x) => '#' + x).join('  '), 540, 1140);
    g.fillStyle = '#c0632a'; g.font = '36px "Dela Gothic One"'; g.fillText('☕ ' + APP_TITLE, 540, 1225);
    return await new Promise((r) => c.toBlob((b) => r(b), 'image/png'));
  })();
  return imgPromise;
}
function toast(text) { let t = $('toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); } t.textContent = text; t.className = 'on'; clearTimeout(toast.tm); toast.tm = setTimeout(() => (t.className = ''), 3200); }
const pageUrl = () => location.origin + location.pathname;
function tweet(text) {
  const u = new URL('https://twitter.com/intent/tweet');
  u.searchParams.set('text', text); u.searchParams.set('url', pageUrl()); u.searchParams.set('hashtags', HASHTAGS.join(','));
  window.open(u.toString(), '_blank', 'noopener');
}
async function share() {
  const t = TYPES[resultKey];
  const text = `私のコーヒータイプは「${t.name}」でした☕\n${t.drink}\n\nあなたは何タイプ？👇`;
  if (matchMedia('(pointer: coarse)').matches && navigator.canShare) {
    try {
      const blob = await makeShareImage();
      const file = new File([blob], `coffee-${resultKey}.png`, { type: 'image/png' });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: `${text}\n${pageUrl()}\n#${HASHTAGS[0]}` }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  tweet(text);
  const blob = await makeShareImage();
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `coffee-${resultKey}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('画像を保存しました。Xの投稿画面に画像を貼り付けてください');
}
async function saveImage() {
  const blob = await makeShareImage();
  const file = new File([blob], `coffee-${resultKey}.png`, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: APP_TITLE }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ===== 診断した人数（共通 counter-api。1端末1回だけ数える） =====
const COUNTER_API = 'https://tonmatolab-counter.tonmatolab.workers.dev';
const PLAY_KEY = 'coffee-play';
function countPlay() {
  try { if (localStorage.getItem('coffee_played')) return; localStorage.setItem('coffee_played', '1'); } catch { return; }
  fetch(`${COUNTER_API}/hit/${PLAY_KEY}`, { method: 'POST' }).catch(() => {});
}
async function loadCount() {
  try {
    const j = await fetch(`${COUNTER_API}/get?keys=${PLAY_KEY}`, { signal: AbortSignal.timeout(8000) }).then((r) => r.json());
    const n = j[PLAY_KEY] || 0;
    if (n > 0) $('playCount').textContent = `☕ これまでに ${n.toLocaleString()}人 が診断しました`;
  } catch {}
}

// ===== スタート画面の絵 =====
function renderStart() {
  const beans = Array.from({ length: 14 }, (_, i) => `<ellipse cx="${(i * 73) % 500}" cy="${(i * 47) % 260}" rx="12" ry="8" transform="rotate(${i * 37} ${(i * 73) % 500} ${(i * 47) % 260})" fill="#7a4a24"/>`).join('');
  $('heroArt').innerHTML = `<svg class="beans" viewBox="0 0 500 260" preserveAspectRatio="xMidYMid slice">${beans}</svg>` +
    `<svg class="cup" viewBox="0 0 240 220">${drinkSVG('latte', { bg: false }).replace(/^<svg[^>]*>|<\/svg>$/g, '')}</svg>`;
  $('typeIcons').innerHTML = Object.keys(TYPES).map((k) => `<div style="background:color-mix(in srgb, ${TYPES[k].color} 18%, var(--card))">${drinkSVG(k, { bg: false })}</div>`).join('');
}

$('startBtn').onclick = startQuiz;
$('backBtn').onclick = () => { if (idx > 0) { idx--; history_.pop(); renderQ(); } };
$('retry').onclick = () => { history.replaceState(null, '', pageUrl()); show('start'); };
$('shareX').onclick = share;
$('saveImg').onclick = saveImage;

renderStart();
const r = new URLSearchParams(location.search).get('r');
if (r && TYPES[r]) { resultKey = r; renderResult(r); }
loadCount();
</script>
