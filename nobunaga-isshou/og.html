<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #1f1a16; font-family: "Shippori Mincho", serif; color: #f1e8d8; display: flex; align-items: center; justify-content: center; }
  .box { width: 1120px; height: 550px; border: 3px solid #a07a2c; border-radius: 8px; display: flex; align-items: center; gap: 64px; padding: 0 80px; box-sizing: border-box; }
  .seal { flex: none; width: 230px; height: 230px; border: 8px solid #e0483e; border-radius: 16px; color: #e0483e; display: grid; place-items: center; font-size: 88px; font-weight: 800; line-height: 1.1; text-align: center; transform: rotate(-6deg); }
  .k { color: #e0483e; font-size: 34px; font-weight: 800; letter-spacing: .2em; margin: 0; }
  h1 { font-size: 86px; font-weight: 800; margin: 6px 0 0; line-height: 1.2; }
  p.s { font-size: 36px; color: #d4a94e; margin: 22px 0 0; font-weight: 800; }
</style>
</head>
<body>
  <div class="box">
    <div class="seal">天下<br>布武</div>
    <div>
      <p class="k">一問誤れば、即退場</p>
      <h1>織田信長の<br>一生クイズ</h1>
      <p class="s">誕生から本能寺まで完走せよ</p>
    </div>
  </div>
</body>
</html>
