<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@800&family=Shippori+Mincho:wght@800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #fff3dc; color: #2b1b14; position: relative; font-family: "M PLUS Rounded 1c", sans-serif;
    background-image: radial-gradient(#f0d9b2 2.4px, transparent 2.4px); background-size: 34px 34px;
  }
  .txt { position: absolute; left: 70px; top: 84px; }
  .k { display: inline-block; background: #2b1b14; color: #ffd23f; font-size: 30px; padding: 2px 24px; border-radius: 99px; }
  h1 { font-family: "Dela Gothic One", sans-serif; font-weight: 400; margin: 18px 0 0; line-height: 1.05; }
  h1 small { display: block; font-size: 70px; }
  h1 span { display: block; font-size: 112px; color: #e8453c; -webkit-text-stroke: 3px #2b1b14; text-shadow: 6px 6px 0 #2b1b14; }
  p { font-size: 34px; margin: 28px 0 0; color: #8a6f5d; }
  .card {
    position: absolute; right: 70px; top: 70px; width: 400px; height: 490px; background: #fffaf0;
    border: 6px double #2b1b14; outline: 3px solid #2b1b14; outline-offset: 7px; transform: rotate(4deg);
    text-align: center; box-shadow: 0 18px 0 rgba(43, 27, 20, .15);
  }
  .card .h { font-family: "Shippori Mincho", serif; font-size: 66px; letter-spacing: .4em; text-indent: .4em; margin: 34px 0 0; line-height: 1.2; }
  .card .w { font-family: "Shippori Mincho", serif; font-size: 30px; margin: 30px 0 0; }
  .card .t { font-family: "Dela Gothic One", sans-serif; color: #e8453c; font-size: 46px; line-height: 1.4; margin: 16px 20px 0; }
  .card .e { font-family: "Shippori Mincho", serif; font-size: 30px; margin: 14px 0 0; }
  .hanko { position: absolute; right: 22px; bottom: 22px; width: 96px; height: 96px; border: 5px solid #e8453c; border-radius: 50%; color: #e8453c;
    font-family: "Shippori Mincho", serif; font-size: 50px; line-height: 88px; transform: rotate(-14deg); }
  .gavel { position: absolute; right: 400px; top: 380px; font-size: 150px; transform: rotate(-30deg); }
</style>
</head>
<body>
  <div class="txt">
    <span class="k">ゲームに負けた人へ</span>
    <h1><small>罰ゲーム</small><span>決めたげる</span></h1>
    <p>場面と強さを選ぶだけ。2タップで判決！</p>
  </div>
  <div class="card">
    <div class="h">判決</div>
    <div class="w">被告（負けた人）は</div>
    <div class="t">一発ギャグを<br>披露する</div>
    <div class="e">の刑に処す。</div>
    <div class="hanko">罰</div>
  </div>
  <div class="gavel">🔨</div>
</body>
</html>
