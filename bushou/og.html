<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@800&family=Shippori+Mincho:wght@800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: radial-gradient(circle at 70% 40%, #4a2a14, #120d0a 70%); color: #f6ecdc; font-family: "M PLUS Rounded 1c"; position: relative; }
  .txt { position: absolute; left: 70px; top: 120px; }
  .k { display: inline-block; border: 3px solid #e8c14a; color: #e8c14a; font-size: 30px; padding: 2px 22px; border-radius: 99px; }
  h1 { font-family: "Shippori Mincho"; font-size: 112px; line-height: 1.05; margin: 16px 0 0;
    background: linear-gradient(#fff6d0, #e8c14a 55%, #a8741e); -webkit-background-clip: text; color: transparent; filter: drop-shadow(0 6px 0 #000); }
  p { font-family: "Shippori Mincho"; font-size: 40px; margin: 18px 0 0; }
  .fan { position: absolute; right: -40px; top: 80px; width: 520px; height: 500px; }
  .c { position: absolute; top: 40px; left: 50%; width: 210px; border: 5px solid; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 40px -10px #000; }
  .c svg { display: block; width: 100%; }
</style></head><body>
<div class="txt"><span class="k">名前で生まれる戦国武将バトル</span><h1>名将ガチャ</h1><p>あなたの名前は何者か</p></div>
<div class="fan" id="fan"></div>
<script src="gen.js"></script><script src="art.js"></script>
<script>
const names = ['さくら', '織田信長', '山田花子'];
document.getElementById('fan').innerHTML = names.map((n, i) => { const b = makeBushou(n); const rot = (i - 1) * 12, dx = (i - 1) * 150, dy = Math.abs(i - 1) * 30;
  return `<div class="c" style="border-color:${b.rarity.color};transform:translateX(calc(-50% + ${dx}px)) translateY(${dy}px) rotate(${rot}deg);z-index:${i === 1 ? 3 : 1}">${portraitSVG(b)}</div>`; }).join('');
</script>
</body></html>
