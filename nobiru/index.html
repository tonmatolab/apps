<style>

    font-size: 1.1rem; font-weight: 900; color: #fff; background: linear-gradient(145deg, #5fd3a4, var(--mint)); box-shadow: 0 6px 0 #2c7d5b, 0 10px 24px rgba(0,0,0,.3); white-space: nowrap; }

<script>
const API = 'https://tonmatolab-counter.tonmatolab.workers.dev';
const GAME = 'nobiru';
const HASHTAGS = ['のびーるトルコアイス', 'とんまとラボ'];
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname); // 手元での確認中はサーバーに記録しない
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem('nobiru_' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('nobiru_' + k, v); } catch {} },
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function todaySeed() { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
const dayGame = () => `${GAME}-d${todaySeed()}`;

// ===== 伸び方 =====
// P＝これまでに引っ張った量（px）。長さは P に対して指数的に伸びる（後半ほど一気に宇宙へ）
const PS = 1600, PA = 1;            // 長さ(m) = PA * (e^(P/PS) - 1)
const MOON = 384400000;             // 月までの距離(m)
const lenOf = (P) => PA * (Math.exp(Math.max(0, P) / PS) - 1);
const pOf = (m) => PS * Math.log(1 + m / PA);
const P_MOON = pOf(MOON);
const CAM = .34;                    // 引っ張った量 1px あたりの画面スクロール量
function fmtLen(m) {
  if (m < 1) return [Math.floor(m * 100).toString(), 'cm'];
  if (m < 1000) return [m < 100 ? m.toFixed(1) : Math.floor(m).toString(), 'm'];
  const km = m / 1000;
  return [km < 100 ? km.toFixed(2) : Math.floor(km).toLocaleString(), 'km'];
}
const lenText = (m) => fmtLen(m).join('');
const TITLES = [
  [MOON, 'ドンドゥルマ伝説', '🌕'], [1e7, '星をなめた人', '🌠'], [1e5, '宇宙アイス飛行士', '🧑‍🚀'], [1e4, '機長に怒られた人', '✈️'],
  [1000, '雲をつかんだ人', '☁️'], [100, '屋上の住人', '🏢'], [30, 'カラスと目が合った人', '🐦‍⬛'], [10, '2階の洗濯物を見た人', '🧺'],
  [3, '屋台の常連', '🍦'], [1, 'つまみ食い', '😋'], [0, 'せっかち', '🐣'],
];
const titleOf = (m) => TITLES.find((t) => m >= t[0]);
// 通過すると表示される見どころ
const MILES = [
  [3, '🧺 2階の洗濯物の高さ！'], [10, '⚡ 電線を越えた！'], [45, '🏢 ビルの屋上に到達！'], [250, '🐦 鳥の群れと並んだ！'], [1000, '☁️ 雲の上へ！'],
  [10000, '✈️ 飛行機の高さ！'], [100000, '🚀 宇宙に到達！'], [400000, '🛰️ 人工衛星と並んだ！'], [1e7, '🌠 星の海へ…'], [1e8, '🌕 月が見えてきた！'],
];

// ===== 状態 =====
let S = null;
function newState(demo) {
  return {
    demo: !!demo, P: 0, T: 0, t: 0, vel: 0, pulling: false, started: false, done: false, best: 0,
    gust: 0, tug: 0, nextEv: 3.5, birds: [], milestone: 0, banner: '', bannerT: 0, msg: '', msgT: 0,
    snapT: 0, bankT: 0, snapAt: 0, confetti: [], splat: 0,
  };
}
const INPUT = { down: false, dy: 0, id: null, y: 0 };
// ちぎれずに引ける速さ（px/秒）。長くなるほど遅くしないとちぎれる
const safeSpeed = (P) => 1550 / (1 + P / 8500);

function update(dt) {
  const s = S;
  s.t += dt;
  if (s.snapT > 0 || s.bankT > 0) { animEnd(dt); return; }
  const dy = INPUT.dy; INPUT.dy = 0;
  s.vel = lerp(s.vel, dy / Math.max(dt, 1e-3), .45);
  s.pulling = INPUT.down;
  if (dy > 0) s.started = true;
  let P = s.P, T = s.T;
  const vs = safeSpeed(P);
  if (dy > 0) {
    const r = s.vel / vs * (s.gust > 0 ? 1.35 : 1);
    T += (r * r * .95 - .32 + P / 110000) * dt; // 長いほど、引いているだけで負担がかかる
    P += dy;
  } else {
    T -= (INPUT.down ? .38 : .85) / (1 + P / 26000) * dt; // 長いほど回復が遅い
    if (s.started && !INPUT.down) P -= (45 + P * .0025) * dt; // 手を離すと少し縮む
  }
  // 出来事
  if (s.started && !s.demo) {
    s.nextEv -= dt;
    if (s.nextEv <= 0 && P > 1400) { startEvent(s, P); s.nextEv = 3.6 + Math.random() * 2.8; }
  }
  if (s.gust > 0) { s.gust -= dt; T += .16 * dt; }
  if (s.tug > 0) { s.tug -= dt; P -= (240 + P * .012) * dt; T += .1 * dt; }
  for (const b of s.birds) {
    if (b.state === 'come') {
      b.x += b.vx * dt; b.y += Math.sin(s.t * 4 + b.ph) * 20 * dt;
      if (Math.abs(b.x - iceX(b.y)) < 16) { b.state = 'flee'; b.vx *= -1.6; T += .32; say(b.rock ? '💥 宇宙ゴミが直撃！' : '🐦‍⬛ カラスにつつかれた！', 1.1); sfx.peck(); vib(40); }
    } else { b.x += b.vx * dt; b.y -= 90 * dt; }
  }
  s.birds = s.birds.filter((b) => b.x > -80 && b.x < VW + 80);
  s.P = Math.max(0, P); s.T = Math.max(0, T);
  const m = lenOf(s.P); s.best = Math.max(s.best, m);
  // 見どころ
  while (s.milestone < MILES.length && m >= MILES[s.milestone][0]) { if (!s.demo) { banner(MILES[s.milestone][1]); sfx.mile(); vib(20); } s.milestone++; }
  if (s.bannerT > 0) s.bannerT -= dt;
  if (s.msgT > 0) s.msgT -= dt;
  if (!s.demo) {
    $('bankBtn').disabled = m < .1;
    sfx.stretch(s);
    if (s.T > .8) vib(12);
    if (s.T >= 1) snap();
    else if (s.P >= P_MOON) { s.P = P_MOON; bank(); }
  }
}
function startEvent(s, P) {
  const alt = lenOf(P), r = Math.random();
  const birdOk = (alt > 4 && alt < 3000) || alt > 1e5;
  if (birdOk && r < .45) {
    const side = Math.random() < .5 ? -1 : 1;
    s.birds.push({ x: side < 0 ? -40 : VW + 40, y: VH * .26 + 120 + Math.random() * VH * .32, vx: side * -(110 + Math.random() * 50), state: 'come', ph: Math.random() * 6, rock: alt > 1e5 });
    say(alt > 1e5 ? '☄️ 宇宙ゴミが飛んできた！タップで壊せ！' : '🐦‍⬛ カラスが来た！タップで追い払え！', 1.6);
  } else if (alt < 50000 && r < .75) { s.gust = 2.2; say('🌪️ 突風！ ゆっくり引いて耐えろ！', 1.6); sfx.wind(); }
  else { s.tug = 1.5; say('😈 おじさんが引っ張り返してきた！', 1.5); sfx.tug(); }
}
function say(t, d = 1.2) { S.msg = t; S.msgT = d; }
function banner(t) { S.banner = t; S.bannerT = 1.8; }
const vib = (ms) => { try { if (navigator.vibrate && !S.demo) navigator.vibrate(ms); } catch {} };

// ===== 描画 =====
let VW = 360, VH = 640, g = null;
const iceX = (y) => VW / 2 + sway(y);
let swayCache = { amp: 0, t: 0, tipY: 0, coneY: 1 };
function sway(y) {
  const c = swayCache, u = clamp((y - c.tipY) / Math.max(1, c.coneY - c.tipY), 0, 1);
  return Math.sin(u * 9 + c.t * 5) * c.amp * Math.sin(u * Math.PI);
}
const SKY = [[0, '#9fd8ff', '#fff1d6'], [2, '#86c8ff', '#dff1ff'], [3.3, '#5aa6f0', '#bfe0ff'], [4, '#2f6fc9', '#7fb6f0'], [4.7, '#14285e', '#3a6db8'], [5.3, '#060a1e', '#16234d'], [9, '#020308', '#070a16']];
function hex(c) { return [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)); }
function mix(a, b, k) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; }
function skyAt(la) {
  for (let i = 0; i < SKY.length - 1; i++) if (la <= SKY[i + 1][0]) { const k = (la - SKY[i][0]) / (SKY[i + 1][0] - SKY[i][0]); return [mix(SKY[i][1], SKY[i + 1][1], k), mix(SKY[i][2], SKY[i + 1][2], k)]; }
  return [SKY.at(-1)[1], SKY.at(-1)[2]];
}
const vendorImg = new Image(); vendorImg.src = '../icons/icon-192.png';
const EF = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function emoji(e, x, y, size, rot = 0) { g.save(); g.translate(x, y); g.rotate(rot); g.font = `${size}px ${EF}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(e, 0, 0); g.restore(); }

  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .3, 'triangle', .16, .25 + i * .1)); },
  mile() { tone(880, .12, 'triangle', .12); tone(1320, .18, 'triangle', .1, .08); },
  peck() { noise(.08, 3000, .35); tone(200, .2, 'square', .08, 0, 90); },
  shoo() { tone(600, .1, 'square', .1, 0, 1200); },
  wind() { noise(.9, 500, .18); },
  tug() { tone(220, .3, 'sawtooth', .07, 0, 140); },
};

// ===== ゲームの流れ =====
const cv = $('cv'); let cctx = cv.getContext('2d'), raf = 0, last = 0;
function fit() { const dpr = Math.min(devicePixelRatio || 1, 2), r = $('game').getBoundingClientRect(); cv.width = r.width * dpr; cv.height = r.height * dpr; cctx.setTransform(dpr, 0, 0, dpr, 0, 0); VW = r.width; VH = r.height; }
function startGame() {
  audio(); sfx.bell();
  if (!store.get('played')) { store.set('played', '1'); api('/hit/' + GAME + '-play', 'POST'); }
  S = newState(false);
  Object.assign(INPUT, { down: false, dy: 0, id: null });
  $('title').classList.add('hidden'); $('result').classList.add('hidden');
  $('game').classList.remove('hidden'); fit();
  $('bankBtn').disabled = true; $('bankBtn').classList.remove('hidden');
  cancelAnimationFrame(raf); last = performance.now(); raf = requestAnimationFrame(loop);
}
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render(cctx, VW, VH, S, true);
  if (!S.done) raf = requestAnimationFrame(loop);
}
function snap() {
  if (S.snapT > 0 || S.bankT > 0) return;
  S.snapT = 1.2; S.snapAt = S.P; sfx.stopStretch(); sfx.snap(); vib([60, 40, 120]);
  $('bankBtn').classList.add('hidden');
  api('/hit/' + GAME + '-snap', 'POST');
  store.set('snaps', String(Number(store.get('snaps') || 0) + 1));
}
function bank() {
  if (S.snapT > 0 || S.bankT > 0) return;
  S.bankT = 1.3; sfx.stopStretch(); sfx.bell(); sfx.win(); vib(30);
  $('bankBtn').classList.add('hidden');
  for (let i = 0; i < 70; i++) S.confetti.push({ x: VW / 2, y: VH * .4, vx: (Math.random() - .5) * 700, vy: -300 - Math.random() * 500, r: Math.random() * 6, c: ['#ff6f91', '#ffd34d', '#5fd3a4', '#6fb6ff', '#fff'][i % 5] });
}
function animEnd(dt) {
  const s = S;
  for (const c of s.confetti) { c.vy += 900 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.r += dt * 8; }
  if (s.snapT > 0) { s.snapT -= dt; if (s.snapT <= 0) finish(false); }
  if (s.bankT > 0) { s.bankT -= dt; if (s.bankT <= 0) finish(true); }
}
let lastRes = null, lastScore = null, lastDay = null;
async function finish(ok) {
  S.done = true; cancelAnimationFrame(raf);
  $('game').classList.add('hidden'); $('result').classList.remove('hidden'); window.scrollTo(0, 0);
  const m = ok ? lenOf(S.P) : lenOf(S.snapAt), cm = Math.round(m * 100);
  const [n, u] = fmtLen(m), t = titleOf(ok ? m : 0);
  lastRes = { ok, m, cm, title: ok ? t[1] : '欲張りすぎた人', icon: ok ? t[2] : '💥' };
  $('resCard').classList.toggle('snap', !ok);
  $('rLbl').textContent = ok ? 'トルコアイスを伸ばした長さ' : 'ちぎれた…記録なし';
  $('rLen').innerHTML = `${n}<small>${u}</small>`;
  $('rTitle').textContent = `${lastRes.icon} ${lastRes.title}`;
  $('rRanks').classList.add('hidden'); $('nameBox').classList.add('hidden');
  const best = Number(store.get('best') || 0);
  if (ok && cm > best) store.set('best', String(cm));
  $('rSub').textContent = ok ? (cm > best ? '🎉 自己ベスト更新！' : `自己ベスト ${lenText(Math.max(best, cm) / 100)}`)
    : `${lenText(m)}まで伸ばしたのに…もったいない！（ちぎった回数 ${store.get('snaps') || 1}回）`;
  lastScore = lastDay = null;
  if (ok && cm >= 10) {
    const [a, d] = await Promise.all([api('/score', 'POST', { game: GAME, ms: cm }), api('/score', 'POST', { game: dayGame(), ms: cm })]);
    if (a && !a.error) lastScore = a; if (d && !d.error) lastDay = d;
    if (lastScore || lastDay) {
      $('rDay').textContent = lastDay ? `${lastDay.rank}位` : '-'; $('rDayT').textContent = lastDay ? `/${lastDay.total}人` : '';
      $('rAll').textContent = lastScore ? `${lastScore.rank}位` : '-'; $('rAllT').textContent = lastScore ? `/${lastScore.total}人` : '';
      $('rRanks').classList.remove('hidden');
      if ((lastScore && lastScore.top10) || (lastDay && lastDay.top10)) {
        $('nameBox').classList.remove('hidden'); $('nameInput').value = store.get('name') || ''; $('nameMsg').textContent = ''; $('nameBtn').disabled = false;
        document.querySelector('.nameBox .row').classList.remove('hidden');
      }
    }
  }
  loadBoard($('boardResult')); loadStats();
}
async function submitName() {
  const name = $('nameInput').value.trim();
  if (!name) { $('nameMsg').textContent = '名前を入力してください'; return; }
  $('nameBtn').disabled = true;
  const tries = [];
  if (lastDay && lastDay.top10) tries.push(['今日', api('/name', 'POST', { game: dayGame(), id: lastDay.id, token: lastDay.token, name })]);
  if (lastScore && lastScore.top10) tries.push(['通算', api('/name', 'POST', { game: GAME, id: lastScore.id, token: lastScore.token, name })]);
  const res = await Promise.all(tries.map((x) => x[1]));
  const okOnes = res.map((r, i) => (r && r.ok ? `${tries[i][0]}${r.rank}位` : null)).filter(Boolean);
  const r = res.find((x) => x && x.ok) || res[0];
  if (okOnes.length) {
    store.set('name', name); document.querySelector('.nameBox .row').classList.add('hidden');
    $('nameMsg').textContent = `「${r.name}」で ${okOnes.join('・')} に登録しました！`; loadBoard($('boardResult')); return;
  }
  $('nameBtn').disabled = false;
  const why = r && r.error;
  $('nameMsg').textContent = why === 'bad_name' ? 'その名前は使えません' : why === 'not_top' ? '他の人に抜かれてトップ10から外れてしまいました…' : why === 'already' ? 'すでに登録済みです' : '登録できませんでした';
}

// ===== シェア =====
const pageUrl = () => 'https://tonmatolab.github.io/apps/nobiru/';
const isMobile = () => /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.tm); toast.tm = setTimeout(() => el.classList.remove('on'), 3200); }
function shareText() {
  const r = lastRes;
  if (!r.ok) return `トルコアイスを${lenText(r.m)}まで伸ばしたのに、プツンとちぎれた…🍦💥\n称号「欲張りすぎた人」\n\nちぎらずに、どこまで伸ばせる？`;
  return `トルコアイスを${lenText(r.m)}伸ばした🍦${r.icon}\n称号「${r.title}」${lastDay ? `｜今日${lastDay.rank}位` : ''}${lastScore ? `｜通算${lastScore.rank}位` : ''}\n\nちぎらずに、どこまで伸ばせる？`;
}
function shareImage() {
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const r = lastRes, la = Math.log10(1 + r.m), [top, bot] = skyAt(la);
  const gr = x.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, top); gr.addColorStop(1, bot); x.fillStyle = gr; x.fillRect(0, 0, W, H);
  // 伸びたアイス
  x.fillStyle = r.ok ? '#fffaf0' : 'rgba(255,250,240,.8)'; x.beginPath(); x.moveTo(W / 2 - 18, 200); x.bezierCurveTo(W / 2 - 40, 600, W / 2 + 30, 900, W / 2 - 60, H - 260); x.lineTo(W / 2 + 60, H - 260); x.bezierCurveTo(W / 2 + 60, 900, W / 2 - 10, 600, W / 2 + 18, 200); x.fill();
  if (!r.ok) { x.fillStyle = top; x.fillRect(W / 2 - 80, 640, 160, 40); }
  x.fillStyle = '#d89a4a'; x.beginPath(); x.moveTo(W / 2 - 80, H - 280); x.lineTo(W / 2 + 80, H - 280); x.lineTo(W / 2, H - 90); x.fill();
  x.fillStyle = '#f6c9a4'; x.beginPath(); x.ellipse(W / 2, 180, 60, 54, 0, 0, 7); x.fill();
  x.textAlign = 'center'; x.fillStyle = '#fff'; x.strokeStyle = 'rgba(40,20,10,.5)'; x.lineWidth = 14; x.lineJoin = 'round';
  x.font = '64px "Dela Gothic One"'; x.strokeText('のびーるトルコアイス', W / 2, 100); x.fillText('のびーるトルコアイス', W / 2, 100);
  x.font = '150px "Dela Gothic One"'; const t = r.ok ? lenText(r.m) : 'プツン…'; x.strokeText(t, W / 2, 560); x.fillText(t, W / 2, 560);
  x.font = '900 56px "Zen Maru Gothic"'; const tt = r.ok ? `${r.icon} ${r.title}` : `${lenText(r.m)}でちぎれた`; x.strokeText(tt, W / 2, 660); x.fillText(tt, W / 2, 660);
  x.font = '700 34px "Zen Maru Gothic"'; x.fillStyle = 'rgba(255,255,255,.9)'; x.fillText('とんまとラボ｜tonmatolab.github.io/apps/nobiru/', W / 2, H - 30);
  return new Promise((res) => c.toBlob(res, 'image/png'));
}
async function share() {
  const text = shareText(), url = pageUrl();
  if (isMobile() && navigator.canShare) {
    try { const blob = await shareImage(); const file = new File([blob], 'nobiru.png', { type: 'image/png' });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: `${text}\n${url}\n#${HASHTAGS[0]}` }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const u = new URL('https://twitter.com/intent/tweet'); u.searchParams.set('text', text); u.searchParams.set('url', url); u.searchParams.set('hashtags', HASHTAGS.join(','));
  window.open(u.toString(), '_blank', 'noopener');
}

// ===== API =====
async function api(path, method = 'GET', data) {
  if (LOCAL && method !== 'GET') return path === '/score' ? { id: 1, token: 't', rank: 2, total: 12, top10: true } : path === '/name' ? { ok: true, rank: 2, name: data.name } : { value: 1 };
  try {
    const opt = { method, signal: AbortSignal.timeout(8000) };
    if (data) { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(data); }
    const res = await fetch(API + path, opt); const j = await res.json().catch(() => null);
    return res.ok ? j : (j && j.error ? { error: j.error } : null);
  } catch { return null; }
}
const boardMode = { boardTitle: 'day', boardResult: 'day' };
async function loadBoard(el) {
  const mode = boardMode[el.id] || 'day';
  const j = await api('/board?game=' + (mode === 'day' ? dayGame() : GAME));
  if (!j || j.error) { el.innerHTML = '<li class="empty">読み込めませんでした</li>'; return; }
  if (!j.top.length) { el.innerHTML = `<li class="empty">${mode === 'day' ? 'まだ今日は誰も記録していません。今日の1位を狙え！' : 'まだ誰も記録していません。一番乗りを狙え！'}</li>`; return; }
  el.innerHTML = '';
  j.top.forEach((r) => {
    const li = document.createElement('li'); li.innerHTML = '<span class="no"></span><span class="nm"></span><span class="ms"></span>';
    li.children[0].textContent = r.rank; li.children[1].textContent = r.name === '名無しの侍' ? '名無しのアイス好き' : r.name; li.children[2].textContent = lenText(r.ms / 100);
    if (r.rank <= 3) li.className = 'top' + r.rank; el.appendChild(li);
  });
}
async function loadStats() {
  const j = await api(`/get?keys=${GAME}-play,${GAME}-snap`);
  $('sPlays').textContent = j && !j.error ? (j[GAME + '-play'] || 0).toLocaleString() : '-';
  $('sSnaps').textContent = j && !j.error ? (j[GAME + '-snap'] || 0).toLocaleString() : '-';
  const b = Number(store.get('best') || 0); $('sBest').textContent = b ? lenText(b / 100) : '-';
}

// ===== 入力 =====
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault(); audio();
  if (!S || S.done || S.snapT > 0 || S.bankT > 0) return;
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const b = S.birds.find((b) => b.state === 'come' && Math.hypot(b.x - px, b.y - py) < 46);
  if (b) { b.state = 'flee'; b.vx = (b.x < VW / 2 ? -1 : 1) * 320; sfx.shoo(); say(b.rock ? '💥 粉砕！' : 'シッシッ！', .8); return; }
  if (INPUT.id !== null) return;
  INPUT.id = e.pointerId; INPUT.down = true; INPUT.y = e.clientY;
  try { cv.setPointerCapture(e.pointerId); } catch {}
});
cv.addEventListener('pointermove', (e) => {
  if (e.pointerId !== INPUT.id) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of evs) { const dy = INPUT.y - ev.clientY; if (dy > 0) INPUT.dy += dy; INPUT.y = ev.clientY; }
});
const up = (e) => { if (e.pointerId === INPUT.id) { INPUT.id = null; INPUT.down = false; } };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
addEventListener('resize', () => { if (!$('game').classList.contains('hidden')) fit(); });
$('bankBtn').onclick = () => { if (S && !S.done && lenOf(S.P) >= .1) bank(); };
$('quitBtn').onclick = () => { if (!S) return; S.done = true; cancelAnimationFrame(raf); sfx.stopStretch(); $('game').classList.add('hidden'); $('title').classList.remove('hidden'); loadStats(); };

// ===== タイトルのデモ =====
const hcv = $('heroCv'), hctx = hcv.getContext('2d'); let demo = newState(true), hLast = 0;
function heroFit() { const dpr = Math.min(devicePixelRatio || 1, 2), r = hcv.getBoundingClientRect(); hcv.width = r.width * dpr; hcv.height = r.height * dpr; hctx.setTransform(dpr, 0, 0, dpr, 0, 0); return r; }
let heroR = heroFit(); addEventListener('resize', () => { heroR = heroFit(); });
function heroTick(now) {
  requestAnimationFrame(heroTick);
  if ($('title').classList.contains('hidden')) return;
  const dt = Math.min(.05, (now - hLast) / 1000 || 0); hLast = now;
  demo.t += dt; demo.started = true;
  demo.P = 1500 + (1 - Math.cos(demo.t * .55)) * 2600; demo.T = .25 + .35 * (1 - Math.cos(demo.t * .55)) / 2;
  const keep = S, kw = VW, kh = VH; S = demo;
  render(hctx, heroR.width, heroR.height, demo, false);
  S = keep; VW = kw; VH = kh;
}
requestAnimationFrame(heroTick);

// ===== タイトル・結果のボタン =====
document.querySelectorAll('[data-ol]').forEach((bd) => bd.querySelectorAll('.btabs button').forEach((b) => (b.onclick = () => {
  bd.querySelectorAll('.btabs button').forEach((x) => x.classList.toggle('on', x === b)); boardMode[bd.dataset.ol] = b.dataset.b; loadBoard($(bd.dataset.ol));
})));
$('startBtn').onclick = startGame; $('againBtn').onclick = startGame; $('shareBtn').onclick = share; $('nameBtn').onclick = submitName;
$('backBtn').onclick = () => { $('result').classList.add('hidden'); $('title').classList.remove('hidden'); window.scrollTo(0, 0); loadBoard($('boardTitle')); };
loadBoard($('boardTitle')); loadStats();
</script>
