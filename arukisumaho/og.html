<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- シェア用サムネ（1200x630）。3D の一枚絵なので index.html?og をそのまま撮る。
     make-og.sh は --disable-gpu で WebGL が動かないため、og.png はこのコマンドで作る：
     "/c/Program Files/Google/Chrome/Application/chrome.exe" --headless=new --use-angle=swiftshader --enable-unsafe-swiftshader \
       --hide-scrollbars --window-size=1200,630 --virtual-time-budget=5000 --screenshot=arukisumaho/og.png "http://localhost:5173/arukisumaho/?og" -->
<style>html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; } iframe { border: 0; width: 1200px; height: 630px; }</style>
</head>
<body><iframe src="index.html?og"></iframe></body>
</html>
