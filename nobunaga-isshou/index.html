<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>織田信長の一生クイズ｜選択をミスったら即死</title>
<meta name="description" content="織田信長の生涯を選択肢で追体験。1問でも間違えると死亡して最初からやり直し。あなたは本能寺までたどり着けるか？">
<meta property="og:type" content="website">
<meta property="og:title" content="織田信長の一生クイズ🔥 1問ミスで即死">
<meta property="og:description" content="誕生から本能寺まで、信長の人生を完走できるか？">
<meta property="og:url" content="https://tonmatolab.github.io/apps/nobunaga-isshou/">
<meta property="og:image" content="https://tonmatolab.github.io/apps/nobunaga-isshou/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Shippori+Mincho:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff4e2;
    --bg2: #ffe7c4;
    --paper: #ffffff;
    --ink: #2b2118;
    --sub: #7a6a5c;
    --red: #e63b2e;
    --red-dark: #b0251a;
    --red-ink: #fff;
    --gold: #ffb703;
    --gold-dark: #c98a00;
    --green: #22a866;
    --line: #f1dfc4;
    --chip: #fff3df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17120e;
      --bg2: #241a12;
      --paper: #231c16;
      --ink: #fbefe0;
      --sub: #c2ae99;
      --red: #ff5a4b;
      --red-dark: #b8382d;
      --red-ink: #fff;
      --gold: #ffc23a;
      --gold-dark: #b88400;
      --green: #3ccf86;
      --line: #3a2e25;
      --chip: #2d241d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(circle at 20% 0%, var(--bg2), var(--bg) 60%) fixed, var(--bg);
    color: var(--ink);
    font-family: "M PLUS Rounded 1c", system-ui, sans-serif;
    line-height: 1.75;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 500px; margin: 0 auto; padding: 14px 16px 48px; }
  .card {
    background: var(--paper);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 6px 0 var(--line), 0 18px 40px -20px rgba(80, 40, 0, .35);
    animation: rise .35s ease both;
  }
  .body { padding: 20px 20px 24px; }
  .scene { display: block; width: 100%; aspect-ratio: 400 / 220; background: #222; position: relative; }
  .scene svg, .scene img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .hidden { display: none !important; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(1.8) rotate(-8deg); opacity: 0; } 60% { transform: scale(.92) rotate(-8deg); opacity: 1; } 100% { transform: scale(1) rotate(-8deg); } }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .display { font-family: "Dela Gothic One", "M PLUS Rounded 1c", sans-serif; font-weight: 400; }

  /* タイトル */
  .kicker {
    display: inline-block; background: var(--ink); color: var(--paper);
    font-weight: 800; font-size: .85rem; padding: 2px 12px; border-radius: 99px; margin: 0 0 10px;
  }
  h1 { font-size: 2.3rem; line-height: 1.2; margin: 0 0 10px; letter-spacing: .02em; }
  h1 .hl { color: var(--red); }
  .lead { color: var(--sub); margin: 0 0 14px; font-size: .95rem; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
  .tags span { background: var(--chip); border-radius: 99px; padding: 4px 12px; font-size: .82rem; font-weight: 700; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 6px; }
  .stat { background: var(--chip); border-radius: 16px; padding: 10px 4px 8px; text-align: center; line-height: 1.3; }
  .stat b { display: block; font-size: 1.45rem; font-family: "Dela Gothic One", sans-serif; font-weight: 400; }
  .stat:nth-child(3) b { color: var(--red); }
  .stat span { font-size: .72rem; color: var(--sub); font-weight: 700; }
  .hint {
    text-align: center; color: var(--gold-dark); font-size: .85rem; font-weight: 700;
    margin: 16px 0 0; animation: bounce 2.4s ease-in-out infinite;
  }

  /* ボタン */
  button {
    display: block; width: 100%;
    font: inherit; font-weight: 800; font-size: 1.02rem;
    border: none; border-radius: 16px;
    padding: 15px 16px; margin-top: 12px;
    cursor: pointer; text-align: center;
    transition: transform .06s ease, box-shadow .06s ease, border-color .15s ease;
  }
  .primary { background: var(--red); color: var(--red-ink); box-shadow: 0 5px 0 var(--red-dark); font-size: 1.15rem; }
  .primary:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--red-dark); }
  .ghost { background: var(--paper); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
  .ghost:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .ghost:hover { border-color: var(--gold); }
  .x { background: #111; color: #fff; box-shadow: 0 5px 0 #000; }
  .x:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* 問題 */
  .qhead { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0 0 6px; }
  .qno { font-family: "Dela Gothic One", sans-serif; color: var(--red); font-size: 1.1rem; margin-right: 4px; }
  .chip { background: var(--chip); border-radius: 99px; padding: 1px 10px; font-size: .8rem; font-weight: 700; color: var(--sub); }
  .timeline { display: flex; gap: 4px; margin: 0 0 14px; }
  .timeline i { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
  .timeline i.done { background: var(--gold); }
  .timeline i.now { background: var(--red); }
  .stage-title { font-size: 1.5rem; margin: 2px 0 10px; line-height: 1.3; }
  .narr { margin: 0 0 14px; background: var(--chip); padding: 12px 14px; border-radius: 16px; font-size: .95rem; }
  .q { font-weight: 800; font-size: 1.15rem; margin: 0 0 2px; }
  .opt {
    display: flex; gap: 12px; align-items: center;
    background: var(--paper); color: var(--ink);
    border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line);
    text-align: left; font-weight: 700; font-size: .98rem; padding: 13px 14px;
  }
  .opt:hover, .opt:focus-visible { border-color: var(--red); outline: none; }
  .opt:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .opt .no {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; color: #fff;
    font-family: "Dela Gothic One", sans-serif; font-size: .95rem;
  }
  #opts .opt:nth-child(1) .no { background: #e63b2e; }
  #opts .opt:nth-child(2) .no { background: #2f7de1; }
  #opts .opt:nth-child(3) .no { background: #22a866; }
  .opt.secret { border-color: var(--gold); box-shadow: 0 4px 0 var(--gold-dark); background: linear-gradient(90deg, #fff6d6, var(--paper)); color: #2b2118; }
  #opts .opt.secret .no { background: var(--gold); }
  .ok {
    display: flex; gap: 10px; align-items: flex-start;
    background: color-mix(in srgb, var(--green) 14%, var(--paper)); border: 2px solid var(--green);
    padding: 10px 12px; margin: 0 0 14px; font-size: .9rem; border-radius: 16px; animation: rise .4s ease both;
  }
  .ok::before { content: "⭕"; font-size: 1.2rem; line-height: 1.4; }

  /* 死亡 */
  .dead-top { text-align: center; margin: -4px 0 8px; }
  .stamp {
    display: inline-block; font-family: "Dela Gothic One", sans-serif; color: var(--red);
    font-size: 3rem; line-height: 1; padding: 10px 22px 12px; border: 6px solid var(--red); border-radius: 14px;
    animation: pop .45s cubic-bezier(.2, .9, .3, 1.3) both; letter-spacing: .1em;
  }
  .dead-sub { text-align: center; color: var(--sub); margin: 12px 0 10px; font-size: .9rem; font-weight: 700; }
  .cause { text-align: center; margin: 0 0 12px; }
  .cause small { display: block; color: var(--sub); font-size: .78rem; font-weight: 800; letter-spacing: .2em; }
  .cause #dCause { display: inline-block; background: var(--ink); color: var(--paper); font-size: 1.3rem; font-weight: 800; padding: 4px 18px; border-radius: 12px; margin-top: 4px; }
  .new { display: inline-block; background: var(--gold); color: #2b2118; font-size: .75rem; font-weight: 800; padding: 1px 10px; border-radius: 99px; margin-left: 6px; vertical-align: middle; animation: bounce 1.6s ease-in-out infinite; }
  #dText { background: var(--chip); padding: 12px 14px; border-radius: 16px; margin: 0; }
  .meta { text-align: center; color: var(--sub); font-size: .85rem; margin: 14px 0 0; line-height: 1.6; font-weight: 700; }

  /* クリア */
  .clear-head { text-align: center; margin: 0; }
  .clear-head span { display: inline-block; background: var(--gold); color: #2b2118; font-weight: 800; padding: 2px 14px; border-radius: 99px; font-size: .9rem; }
  .clear-title { text-align: center; font-size: 2.1rem; margin: 8px 0 12px; line-height: 1.3; }
  #cText { background: var(--chip); padding: 12px 14px; border-radius: 16px; margin: 0; }
  .rank { text-align: center; font-size: 1.05rem; margin: 18px 0 4px; font-weight: 800; }
  .rank b { color: var(--red); font-size: 2.4rem; margin: 0 6px; font-family: "Dela Gothic One", sans-serif; font-weight: 400; }
  .poem { text-align: center; color: var(--sub); font-size: .9rem; margin: 14px 0 0; font-family: "Shippori Mincho", serif; }

  /* 図鑑 */
  .zk-head { display: flex; justify-content: space-between; align-items: baseline; }
  .zk-head h2 { margin: 0; font-size: 1.6rem; }
  .zk-head span { color: var(--red); font-family: "Dela Gothic One", sans-serif; font-size: 1.2rem; }
  .bar { height: 12px; background: var(--chip); border-radius: 6px; overflow: hidden; margin: 10px 0 16px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--gold), var(--red)); border-radius: 6px; }
  .zk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .zk { background: var(--chip); border-radius: 14px; padding: 10px 12px; line-height: 1.45; border: 2px solid transparent; font-size: .88rem; }
  .zk small { display: block; color: var(--sub); font-size: .72rem; font-weight: 700; }
  .zk b { display: block; }
  .zk.locked { opacity: .7; }
  .zk.locked b { color: var(--sub); letter-spacing: .2em; }
  .zk.got { cursor: pointer; background: var(--paper); border-color: var(--line); box-shadow: 0 3px 0 var(--line); }
  .zk.got b::before { content: "💀 "; }
  .zk.got:hover { border-color: var(--red); }
  .zk.secret { grid-column: 1 / -1; border-color: var(--gold); }
  .zk.secret.got b::before { content: "✦ "; }
  .zk-detail { margin: 14px 0 0; padding: 12px 14px; background: var(--chip); border-radius: 14px; font-size: .92rem; }

  .flash { position: fixed; inset: 0; background: #e63b2e; pointer-events: none; opacity: 0; z-index: 10; }
  .flash.on { animation: flash .6s ease; }
  @keyframes flash { 0% { opacity: .55; } 100% { opacity: 0; } }

  footer { text-align: center; color: var(--sub); font-size: .8rem; margin-top: 24px; }
  footer a { color: var(--sub); }
</style>
</head>
<body>
<div class="flash" id="flash"></div>
<main>
  <!-- タイトル -->
  <section id="title" class="card">
    <div class="scene" data-scene="title"></div>
    <div class="body">
      <p class="kicker">1問ミスで即死!?</p>
      <h1 class="display">織田信長の<br><span class="hl">一生クイズ</span></h1>
      <p class="lead">あなたは織田信長。史実どおりに選んで、本能寺まで生き残れ！ まちがえたら…その場で即死です。</p>
      <div class="tags"><span>⏱ 約2分</span><span>📝 全10問</span><span>💀 死因は20種類</span></div>
      <div class="stats">
        <div class="stat"><b id="sPlay">…</b><span>挑戦した人</span></div>
        <div class="stat"><b id="sClear">…</b><span>完走した人</span></div>
        <div class="stat"><b id="sRate">…</b><span>完走率</span></div>
      </div>
      <button class="primary hidden" id="resumeBtn"></button>
      <button class="primary" id="startBtn">人生スタート！</button>
      <button class="ghost" id="zukanBtn">📖 死因図鑑</button>
      <p class="meta" id="myStats"></p>
      <p class="hint">👀 図鑑を半分集めると、何かが起きるらしい…</p>
    </div>
  </section>

  <!-- ステージ -->
  <section id="stage" class="card hidden">
    <div class="scene" id="stScene"></div>
    <div class="body">
      <div class="timeline" id="tl"></div>
      <div class="ok hidden" id="okMsg"></div>
      <div class="qhead"><span class="qno" id="stNo"></span><span class="chip" id="stYear"></span><span class="chip" id="stAge"></span></div>
      <h2 class="stage-title display" id="stTitle"></h2>
      <p class="narr" id="stNarr"></p>
      <p class="q" id="stQ"></p>
      <div id="opts"></div>
    </div>
  </section>

  <!-- 死亡 -->
  <section id="dead" class="card hidden">
    <div class="scene" data-scene="grave"></div>
    <div class="body">
      <div class="dead-top"><span class="stamp">死亡</span></div>
      <p class="dead-sub" id="dYear"></p>
      <p class="cause"><small>死因</small><span id="dCause"></span><span class="new hidden" id="dNew">NEW 図鑑に追加</span></p>
      <p id="dText"></p>
      <p class="meta" id="dMeta"></p>
      <button class="primary" id="retryBtn">もう一回生まれる！</button>
      <div class="row">
        <button class="x" id="shareDead">𝕏 でシェア</button>
        <button class="ghost" id="imgDead">🪦 墓石画像</button>
      </div>
      <button class="ghost" id="zukanBtn2">📖 死因図鑑を見る</button>
    </div>
  </section>

  <!-- クリア／隠しエンド -->
  <section id="clear" class="card hidden">
    <div class="scene" id="cScene"></div>
    <div class="body">
      <p class="clear-head"><span id="cHead"></span></p>
      <h2 class="clear-title display" id="cTitle"></h2>
      <p id="cText"></p>
      <p class="poem" id="cPoem"></p>
      <p class="rank" id="cRankP"><span id="cRankPre"></span><b id="cRank"></b><span id="cRankPost"></span></p>
      <p class="meta" id="cMeta"></p>
      <div class="row">
        <button class="x" id="shareClear">𝕏 でシェア</button>
        <button class="ghost" id="imgClear">認定証画像</button>
      </div>
      <button class="primary" id="againBtn">もう一度生まれる</button>
      <button class="ghost" id="zukanBtn3">📖 死因図鑑を見る</button>
    </div>
  </section>

  <!-- 死因図鑑 -->
  <section id="zukan" class="card hidden">
    <div class="body">
      <div class="zk-head"><h2 class="display">📖 死因図鑑</h2><span id="zkCount"></span></div>
      <div class="bar"><div id="zkBar"></div></div>
      <div class="zk-grid" id="zkGrid"></div>
      <div class="zk-detail hidden" id="zkDetail"></div>
      <button class="primary" id="zkBack">タイトルへ戻る</button>
    </div>
  </section>

  <footer><a href="../">ほかの診断・アプリを見る</a></footer>
</main>

<script>
const APP_TITLE = '織田信長の一生クイズ';
const HASHTAGS = ['信長の一生クイズ'];
const SITE = 'tonmatolab.github.io/apps';
const SECRET_NEED = 10; // 隠しエンドの解放に必要な死因の数

// ===== 全員のカウント（counter-api。失敗しても遊べる） =====
const COUNTER = {
  base: 'https://tonmatolab-counter.tonmatolab.workers.dev',
  play: 'nobunaga-play',
  clear: 'nobunaga-clear',
  secret: 'nobunaga-secret',
};
async function api(path, method = 'GET') {
  if (!COUNTER.base.startsWith('http')) return null;
  try {
    const res = await fetch(COUNTER.base + path, { method, signal: AbortSignal.timeout(8000) });
    return res.ok ? await res.json() : null;
  } catch { return null; }
}
async function counter(action, key) {
  if (action === 'hit') {
    const j = await api(`/hit/${key}`, 'POST');
    return j && typeof j.value === 'number' ? j.value : null;
  }
  const j = await api(`/get?keys=${key}`);
  return j && typeof j[key] === 'number' ? j[key] : null;
}

// ===== 端末ごとの記録 =====
const store = {
  get(k) { try { return localStorage.getItem('nobu_' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('nobu_' + k, v); } catch {} },
  del(k) { try { localStorage.removeItem('nobu_' + k); } catch {} },
};

// ===== ステージ =====
// a: [選択肢, 正解?, 死因, 死に様の説明]
const STAGES = [
  {
    year: '1534年', age: '0歳', title: '尾張に生まれる', scene: 'birth',
    narr: '尾張の戦国大名・織田信秀の嫡男として、元気な男の子が誕生した。のちの織田信長である。',
    q: 'この赤子につけられた幼名は？',
    ok: '「吉法師（きっぽうし）」としてすくすく育つ。',
    a: [
      ['吉法師', true],
      ['竹千代', false, '名前ちがい', 'それは徳川家康の幼名。名前を取り違えられた赤子は、なぜか三河の松平家へ。家康として育ちかけたところで本物とのダブルブッキングが発覚し、歴史から静かに消された。'],
      ['三法師', false, '孫あつかい', 'それは信長の孫の幼名。生まれた瞬間から「孫」として扱われ、0歳にして跡継ぎ争いに担ぎ出される。おしゃぶりをくわえたまま会議に出席させられ、心労で倒れた。'],
    ],
  },
  {
    year: '1540年代', age: '少年期', title: '尾張の大うつけ', scene: 'utsuke',
    narr: '若き吉法師は城下を遊び歩き、家臣たちから「大うつけ（大バカ者）」と呼ばれていた。',
    q: '町を歩くときの、あなたの格好は？',
    ok: '奇抜な格好で町を練り歩き、立派に「大うつけ」の評判を獲得した。',
    a: [
      ['着物の袖を外し、腰に瓢箪や火打袋をジャラジャラぶら下げる', true],
      ['頭を丸めて墨染めの衣をまとい、お経を唱えて歩く', false, '出家まちがい', 'あまりに堂に入った僧侶っぷりに、通りがかりの和尚が「ぜひ弟子に」とスカウト。そのまま寺に入り、修行一筋の静かな一生を送った。'],
      ['南蛮渡来の甲冑とマントでキメる', false, '時代の先取りすぎ', 'ポルトガル人が種子島に来るのは1543年。まだ日本にない南蛮甲冑を探して堺まで走り続け、そのまま行方不明になった。'],
    ],
  },
  {
    year: '1552年', age: '18歳', title: '父の葬儀', scene: 'funeral',
    narr: '父・信秀が急死。盛大な葬儀が営まれ、いよいよ喪主の焼香の番がやってきた。',
    q: 'どうする？',
    ok: '抹香をわしづかみにして位牌へ投げつけた。参列者はドン引きしたが、これぞ信長。',
    a: [
      ['抹香をわしづかみにして、位牌に投げつける', true],
      ['位牌の前で刀を抜き、「父上の仇はどこだ！」と叫ぶ', false, '乱心', '父は病死である。存在しない仇を探して寺中を走り回った結果、「若殿ご乱心」として座敷牢へ。家督は弟・信勝のものになった。'],
      ['葬儀をサボって川で泳ぐ', false, '寒中水泳', '季節は春先。冷たい川に飛び込んだ結果、ひどい風邪をこじらせた。父の葬儀の翌週、自分の葬儀が同じ寺で開かれた。'],
    ],
  },
  {
    year: '1553年', age: '19歳', title: '「マムシ」との対面', scene: 'mamushi',
    narr: '妻・濃姫の父であり、「美濃のマムシ」と恐れられる斎藤道三が、正徳寺で会いたいと言ってきた。道三は物陰から、あなたの様子をこっそり見ているらしい。',
    q: 'どうやって会う？',
    ok: '道中はうつけ姿、会見では見事な正装。道三は「わが息子たちは、あのうつけの門前に馬をつなぐことになろう」とつぶやいた。',

function burst(cx, cy, n, color, op) {
  let p = '';
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, w = 0.025 + (i % 3) * 0.012;
    p += `<polygon points="${cx + Math.cos(a - w) * 600},${cy + Math.sin(a - w) * 600} ${cx + Math.cos(a + w) * 600},${cy + Math.sin(a + w) * 600} ${cx + Math.cos(a) * 46},${cy + Math.sin(a) * 46}"/>`;
  }
  return `<g fill="${color}" opacity="${op}">${p}</g>`;
}

const $ = (id) => document.getElementById(id);
const NUMS = ['1', '2', '3', '4'];
let idx = 0;
let lastDeath = null;
let lastEnd = 'clear';

function show(id) {
  ['title', 'stage', 'dead', 'clear', 'zukan'].forEach((s) => $(s).classList.toggle('hidden', s !== id));
  window.scrollTo(0, 0);
}

const deaths = () => Number(store.get('deaths') || 0);
function zukan() { try { return new Set(JSON.parse(store.get('zukan') || '[]')); } catch { return new Set(); } }
function addZukan(id) { const z = zukan(); const isNew = !z.has(id); z.add(id); store.set('zukan', JSON.stringify([...z])); return isNew; }
const zCount = () => [...zukan()].filter((id) => id !== 'secret').length;

function renderTitle() {
  const p = store.get('progress');
  const pi = p === null ? -1 : Number(p);
  if (pi > 0 && pi < STAGES.length) {
    $('resumeBtn').textContent = `▶ 続きから（${STAGES[pi].title}）`;
    $('resumeBtn').classList.remove('hidden');
    $('startBtn').className = 'ghost';
    $('startBtn').textContent = '最初からやり直す';
  } else {
    $('resumeBtn').classList.add('hidden');
    $('startBtn').className = 'primary';
    $('startBtn').textContent = '人生スタート！';
  }
  const parts = [];
  if (deaths()) parts.push(`死亡回数 ${deaths()}回`);
  parts.push(`死因図鑑 ${zCount()} / ${DEATHS.length}`);
  $('myStats').textContent = parts.join('　｜　');
  show('title');
}

async function loadStats() {
  const j = await api(`/get?keys=${COUNTER.play},${COUNTER.clear}`);
  if (!j) { ['sPlay', 'sClear', 'sRate'].forEach((id) => ($(id).textContent = '-')); return; }
  const play = j[COUNTER.play] || 0, clear = j[COUNTER.clear] || 0;
  $('sPlay').textContent = play.toLocaleString();
  $('sClear').textContent = clear.toLocaleString();
  $('sRate').textContent = play ? `${((clear / play) * 100).toFixed(1)}%` : '-';
}

function start(from = 0) {
  if (!store.get('played')) { store.set('played', '1'); counter('hit', COUNTER.play); }
  idx = from;
  $('okMsg').classList.add('hidden');
  renderStage();
  show('stage');
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function renderStage() {
  const s = STAGES[idx];
  store.set('progress', String(idx));
  $('stScene').innerHTML = scene(s.scene);
  $('tl').innerHTML = STAGES.map((_, i) => `<i class="${i < idx ? 'done' : i === idx ? 'now' : ''}"></i>`).join('');
  $('stNo').textContent = `第${idx + 1}問`;
  $('stYear').textContent = s.year;
  $('stAge').textContent = s.age;
  $('stTitle').textContent = s.title;
  $('stNarr').textContent = s.narr;
  $('stQ').textContent = s.q;
  const opts = shuffle(s.a.map((o, ai) => ({ o, ai })));
  if (s.secret && zCount() >= SECRET_NEED) opts.push({ o: s.secret, ai: 'secret' });
  const box = $('opts');
  box.innerHTML = '';
  opts.forEach(({ o, ai }, n) => {
    const b = document.createElement('button');
    b.className = 'opt' + (ai === 'secret' ? ' secret' : '');
    b.innerHTML = `<span class="no">${ai === 'secret' ? '✦' : NUMS[n]}</span><span></span>`;
    b.lastChild.textContent = o[0];
    b.onclick = () => choose(o, ai);
    box.appendChild(b);
  });
  $('stage').style.animation = 'none'; void $('stage').offsetWidth; $('stage').style.animation = '';
  window.scrollTo(0, 0);
}

function choose(o, ai) {
  const s = STAGES[idx];
  if (o[1] === 'secret') return finish('secret');
  if (!o[1]) return die(s, `${idx}-${ai}`, o[2], o[3]);
  idx++;
  if (idx >= STAGES.length) return finish('clear');
  $('okMsg').textContent = `正解！ ${s.ok}`;
  $('okMsg').classList.remove('hidden');
  renderStage();
}

function die(s, id, cause, text) {
  store.set('deaths', String(deaths() + 1));
  store.del('progress');
  const isNew = addZukan(id);
  lastDeath = { stage: s, cause, n: idx + 1 };
  $('dYear').textContent = `${s.year}・${s.title}`;
  $('dCause').textContent = cause;
  $('dNew').classList.toggle('hidden', !isNew);
  $('dText').textContent = text;
  const unlock = zCount() >= SECRET_NEED && isNew && zCount() === SECRET_NEED ? '\n✦ 図鑑が半分埋まった。本能寺で何かが起きるかもしれない…' : '';
  $('dMeta').textContent = `到達 ${idx + 1} / ${STAGES.length}　｜　死亡 ${deaths()}回　｜　図鑑 ${zCount()} / ${DEATHS.length}${unlock}`;
  $('dMeta').style.whiteSpace = 'pre-line';
  const f = $('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
  setTimeout(() => f.classList.remove('on'), 700);
  if (navigator.vibrate) navigator.vibrate(180);
  show('dead');
}

async function finish(kind) {
  lastEnd = kind;
  const e = ENDS[kind];
  store.del('progress');
  if (kind === 'secret') addZukan('secret');
  $('cScene').innerHTML = scene(e.scene);
  $('cHead').textContent = e.head;
  $('cTitle').textContent = e.title;
  $('cText').textContent = e.text;
  $('cPoem').textContent = e.poem;
  $('cRankPre').textContent = e.pre;

function renderZukan() {

const F = '"Shippori Mincho", serif';
async function fontsReady() {
  await Promise.all([document.fonts.load(`800 60px ${F}`), document.fonts.load(`400 40px ${F}`)]);
}
function canvas() {
  const c = document.createElement('canvas');
  c.width = 1080; c.height = 1350;
  return [c, c.getContext('2d')];
}
function wrapText(g, text, x, y, maxW, lh) {
  let line = '', n = 0;
  for (const ch of text) {
    if (g.measureText(line + ch).width > maxW) { g.fillText(line, x, y + n * lh); n++; line = ch; } else line += ch;
  }
  g.fillText(line, x, y + n * lh);
  return n + 1;
}
function rrect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

async function graveImage() {
  await fontsReady();
  const d = lastDeath;
  const [c, g] = canvas();
  const W = 1080, H = 1350;
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#1b1f26'); bg.addColorStop(1, '#0d0f12');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.textAlign = 'center';
  g.fillStyle = '#e0483e'; g.font = `800 120px ${F}`;
  g.fillText('無 念', W / 2, 190);
  g.fillStyle = '#b5a690'; g.font = `400 40px ${F}`;
  g.fillText(`${d.stage.year}・${d.stage.title}`, W / 2, 268);
  // 墓石
  const cx = W / 2, top = 330, bottom = 1010, sw = 300;
  g.fillStyle = '#5d636c'; g.fillRect(cx - 250, bottom, 500, 60);
  g.fillStyle = '#727a84'; g.fillRect(cx - 200, bottom - 50, 400, 54);
  const st = g.createLinearGradient(cx - sw / 2, 0, cx + sw / 2, 0);
  st.addColorStop(0, '#9aa2ac'); st.addColorStop(1, '#737b85');
  g.fillStyle = st;
  g.beginPath();
  g.moveTo(cx - sw / 2, bottom - 50); g.lineTo(cx - sw / 2, top + 60);
  g.quadraticCurveTo(cx, top - 30, cx + sw / 2, top + 60); g.lineTo(cx + sw / 2, bottom - 50); g.closePath(); g.fill();
  // 縦書きの死因
  const chars = [...d.cause].map((ch) => (ch === 'ー' ? '｜' : ch));
  const size = Math.min(100, Math.floor(560 / chars.length));
  g.fillStyle = '#2f343b'; g.font = `800 ${size}px ${F}`;
  const startY = top + 90 + (560 - size * chars.length) / 2 + size * .85;
  chars.forEach((ch, i) => g.fillText(ch, cx, startY + i * size));
  g.fillStyle = '#3a3f46'; g.font = `700 30px ${F}`;
  g.fillText('死因', cx, top + 70);
  // 煙
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 5;
  g.beginPath(); g.moveTo(cx + 330, bottom + 20);
  g.bezierCurveTo(cx + 290, bottom - 120, cx + 370, bottom - 220, cx + 330, bottom - 360); g.stroke();
  g.fillStyle = '#2b2f36'; g.beginPath(); g.ellipse(cx + 330, bottom + 30, 60, 22, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#f1e8d8'; g.font = `400 38px ${F}`;
  g.fillText(`到達 ${d.n}/${STAGES.length}　死亡 ${deaths()}回　図鑑 ${zCount()}/${DEATHS.length}`, W / 2, 1160);
  g.fillStyle = '#d4a94e'; g.font = `800 44px ${F}`;
  g.fillText(APP_TITLE, W / 2, 1250);
  g.fillStyle = '#b5a690'; g.font = `400 28px ${F}`;
  g.fillText(SITE, W / 2, 1296);
  return c;
}

  const rank = store.get(e.rankKey);
  const [c, g] = canvas();
  const W = 1080, H = 1350;
  g.fillStyle = '#f4ecd8'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#a07a2c'; g.lineWidth = 10; g.strokeRect(50, 50, W - 100, H - 100);
  g.strokeStyle = '#b3261e'; g.lineWidth = 3; g.strokeRect(78, 78, W - 156, H - 156);
  g.textAlign = 'center';
  // 家紋
  const cx = W / 2, cy = 220, s = 70;
  g.fillStyle = '#1f1a16';
  for (let k = 0; k < 5; k++) { const a = (-90 + k * 72) * Math.PI / 180; g.beginPath(); g.arc(cx + Math.cos(a) * s * .55, cy + Math.sin(a) * s * .55, s * .5, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = '#f4ecd8'; g.beginPath(); g.arc(cx, cy, s * .5, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#1f1a16';
  for (let k = 0; k < 5; k++) { const a = (-90 + k * 72) * Math.PI / 180; g.beginPath(); g.arc(cx + Math.cos(a) * s * .22, cy + Math.sin(a) * s * .22, s * .13, 0, Math.PI * 2); g.fill(); }
  const secret = lastEnd === 'secret';
  g.fillStyle = '#1f1a16'; g.font = `800 96px ${F}`;
  g.fillText(secret ? '南蛮王到達証' : '天下人認定証', W / 2, 420);
  g.fillStyle = '#b3261e'; g.font = `800 64px ${F}`;
  g.fillText(rank ? `第 ${Number(rank).toLocaleString()} 号` : '', W / 2, 520);
  g.fillStyle = '#3a312a'; g.font = `400 44px ${F}`;
  const lines = secret
    ? ['右の者', '本能寺より南蛮へ渡り', '歴史にない道を切り拓いたことを', 'ここに認める']
    : ['右の者', '織田信長の生涯を', '史実どおりに完走したことを', 'ここに認める'];
  lines.forEach((l, i) => g.fillText(l, W / 2, 640 + i * 76));
  g.fillStyle = '#6f6254'; g.font = `400 36px ${F}`;
  g.fillText(`死亡回数 ${deaths()}回　｜　死因図鑑 ${zCount()} / ${DEATHS.length}`, W / 2, 990);
  // 朱印
  g.save(); g.translate(820, 1100); g.rotate(-0.12);
  g.strokeStyle = '#b3261e'; g.lineWidth = 10; rrect(g, -90, -90, 180, 180, 14); g.stroke();
  g.fillStyle = '#b3261e'; g.font = `800 64px ${F}`;
  g.fillText('天下', 0, -10); g.fillText('布武', 0, 66);
  g.restore();
  g.textAlign = 'left';
  g.fillStyle = '#a07a2c'; g.font = `800 40px ${F}`;
  g.fillText(APP_TITLE, 130, 1150);
  g.fillStyle = '#6f6254'; g.font = `400 28px ${F}`;
  g.fillText(SITE, 130, 1200);
  return c;
}

async function saveCanvas(c, name) {
  const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
  const file = new File([blob], name, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: APP_TITLE }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ===== シェア =====
function pageUrl() { return location.origin + location.pathname; }
function tweet(text) {
  const u = new URL('https://twitter.com/intent/tweet');
  u.searchParams.set('text', text);
  u.searchParams.set('url', pageUrl());
  u.searchParams.set('hashtags', HASHTAGS.join(','));
  window.open(u.toString(), '_blank', 'noopener');
}

    : `織田信長の一生を完走しました🔥${rankText}\n（死亡${deaths()}回・死因図鑑${zCount()}/${DEATHS.length}）\n\n是非に及ばず。あなたは完走できる？`);
};
$('imgDead').onclick = async () => saveCanvas(await graveImage(), 'nobunaga-grave.png');
$('imgClear').onclick = async () => saveCanvas(await certImage(), `nobunaga-${lastEnd}.png`);

document.querySelectorAll('[data-scene]').forEach((el) => (el.innerHTML = scene(el.dataset.scene)));
renderTitle();
loadStats();
