<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>無料診断・ミニアプリ集</title>
<meta name="description" content="1分で遊べる無料の診断・ミニアプリ集。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f7f4ef; --card: #fff; --ink: #2b2622; --sub: #857a70; --line: #e7e0d6; --accent: #b5652d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1917; --card: #262320; --ink: #f2ece5; --sub: #b0a597; --line: #3a3530; --accent: #e08a4a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "M PLUS Rounded 1c", system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p { color: var(--sub); margin: 0 0 24px; }
  a.app { display: flex; gap: 16px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; color: var(--ink); text-decoration: none; }
  a.app:hover { border-color: var(--accent); }
  .icon { font-size: 2.2rem; }
  .name { font-weight: 800; }
  .desc { color: var(--sub); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>無料診断・ミニアプリ集</h1>
  <p>1分で遊べる診断やツールを公開しています。</p>
  <!-- 新しいアプリはここに1ブロック追加（新しいものを上に） -->
  <a class="app" href="nobunaga-isshou/">
    <div class="icon">🔥</div>
    <div><div class="name">織田信長の一生クイズ</div><div class="desc">1問ミスで即死。本能寺まで完走できるか？</div></div>
  </a>
  <a class="app" href="coffee-shindan/">
    <div class="icon">☕</div>
    <div><div class="name">コーヒータイプ診断</div><div class="desc">8問であなたにぴったりの1杯がわかる</div></div>
  </a>
</main>
</body>
</html>
