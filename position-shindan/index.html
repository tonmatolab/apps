// 能力ごとの満点・平均・ばらつき（4択を適当に選んだ人を「ふつうの人」として比べる）
const KEYS = [...Object.keys(STATS), ...Object.keys(TRAITS), 'v', 'h'];
const MAX = {}, MEAN = {}, SD = {};
for (const k of KEYS) {
  let mx = 0, m = 0, vr = 0;
  for (const q of QUESTIONS) {
    const xs = q.a.map(([, e]) => e[k] || 0), mu = xs.reduce((a, b) => a + b, 0) / xs.length;
    mx += Math.max(0, ...xs); m += mu; vr += xs.reduce((a, b) => a + (b - mu) ** 2, 0) / xs.length;

}
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const z = (s, k) => (s[k] - MEAN[k]) / SD[k];
// 正規分布の累積で「ふつうの人の中でどのあたりか」を -1〜1 に

const GK_LINE = 0.7, DIST_W = 6, BIAS_W = 0.25;

function sumAnswers(answers) {
  const s = { v: 0, h: 0, vp: 0, vn: 0, avoid: 0 };
  for (const k of [...Object.keys(STATS), ...Object.keys(TRAITS)]) s[k] = 0;
  answers.forEach((ai, qi) => {
    if (ai == null) return;
    const e = QUESTIONS[qi].a[ai][1];
    for (const [k, x] of Object.entries(e)) s[k] = (s[k] || 0) + x;
    if (e.v > 0) s.vp += e.v; if (e.v < 0) s.vn -= e.v;

}
// ふつうの人と比べてどれだけ多いか（標準化した値）で重みづけ
const dot = (s, w) => Object.entries(w || {}).reduce((t, [k, x]) => t + x * z(s, k), 0);

function pickPos(s) {
  const v = rank(s, 'v'), h = rank(s, 'h');
  if (rank(s, 'gk') >= GK_LINE && v <= 0) return { pos: 'GK', v, h };
  let best = null, bs = -Infinity;
  for (const [id, p] of Object.entries(POS)) {
    if (id === 'GK') continue;
    const d = (v - p.v) ** 2 + (h - p.h) ** 2;
    const sc = -d * DIST_W + dot(s, p.bias) * BIAS_W;

}

}

}

    if (y < 1110) { y += 26; g.fillStyle = '#5d7563'; g.font = '800 32px "M PLUS Rounded 1c"'; for (const ln of wrapText(g, t.desc, 860).slice(0, Math.floor((1180 - y) / 46))) { g.fillText(ln, 110, y); y += 46; } }
    g.textAlign = 'center'; g.fillStyle = '#1f9d55'; g.font = '40px "Dela Gothic One"'; g.fillText('⚽ ' + APP_TITLE, 540, 1235);
    return await new Promise((r) => c.toBlob((b) => r(b), 'image/png'));
  })();
  return imgPromise;
}
function toast(text) { let t = $('toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); } t.textContent = text; t.className = 'on'; clearTimeout(toast.tm); toast.tm = setTimeout(() => (t.className = ''), 3200); }
const pageUrl = () => location.origin + location.pathname;
function shareText() { const t = TYPES[result.type]; return `私の適正ポジションは【${posLabel(result.type)}｜${t.style}】「${t.name}」でした⚽\n\nあなたはピッチのどこ？👇`; }
function tweet(text) {
  const u = new URL('https://twitter.com/intent/tweet');
  u.searchParams.set('text', text); u.searchParams.set('url', pageUrl()); u.searchParams.set('hashtags', HASHTAGS.join(','));
  window.open(u.toString(), '_blank', 'noopener');
}
async function share() {
  const text = shareText();
  if (matchMedia('(pointer: coarse)').matches && navigator.canShare) {
    try {
      const blob = await makeShareImage();
      const file = new File([blob], `position-${result.type}.png`, { type: 'image/png' });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: `${text}\n${pageUrl()}\n#${HASHTAGS[0]}` }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  tweet(text);
  const blob = await makeShareImage();
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `position-${result.type}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('画像を保存しました。Xの投稿画面に画像を貼り付けてください');
}
async function saveImage() {
  const blob = await makeShareImage();
  const file = new File([blob], `position-${result.type}.png`, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: APP_TITLE }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ===== 診断した人数・ポジションごとの割合（共通 counter-api。1端末1回だけ数える） =====
const COUNTER_API = 'https://tonmatolab-counter.tonmatolab.workers.dev';
const PLAY_KEY = 'position-play';
const posKey = (p) => `position-p-${p.toLowerCase()}`;
function countPlay() {
  try { if (localStorage.getItem('position_played')) return; localStorage.setItem('position_played', '1'); } catch { return; }
  fetch(`${COUNTER_API}/hit/${PLAY_KEY}`, { method: 'POST' }).catch(() => {});
  const p = TYPES[result.type].pos;
  if (p) fetch(`${COUNTER_API}/hit/${posKey(p)}`, { method: 'POST' }).catch(() => {});
}
let countsCache = null;
function fetchCounts() {
  if (countsCache) return countsCache;
  const keys = [PLAY_KEY, ...Object.keys(POS).map(posKey)];
  countsCache = fetch(`${COUNTER_API}/get?keys=${keys.join(',')}`, { signal: AbortSignal.timeout(8000) }).then((r) => r.json()).catch(() => { countsCache = null; return null; });
  return countsCache;
}
async function loadCount() {
  const j = await fetchCounts(); const n = j && j[PLAY_KEY];
  if (n > 0) $('playCount').textContent = `⚽ これまでに ${n.toLocaleString()}人 が診断しました`;
}
async function loadPct() {
  const p = TYPES[result.type].pos; if (!p) return;
  const j = await fetchCounts(); if (!j) return;
  const total = Object.keys(POS).reduce((s, k) => s + (j[posKey(k)] || 0), 0);
  if (total < 30) return; // 少ないうちは出さない
  const pct = Math.round(((j[posKey(p)] || 0) / total) * 1000) / 10;
  $('rPct').textContent = `全国の診断者のうち ${pct}% が ${POS[p].name}（${p}）でした`;
}
