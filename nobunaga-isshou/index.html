const COUNTER = {
  base: 'https://tonmatolab-counter.tonmatolab.workers.dev',
  play: 'nobunaga-play',
  clear: 'nobunaga-clear',
};
async function api(path, method = 'GET') {
  if (!COUNTER.base.startsWith('http')) return null;
  try {
    const res = await fetch(COUNTER.base + path, { method, signal: AbortSignal.timeout(8000) });
    return res.ok ? await res.json() : null;
  } catch { return null; }
}
async function counter(action, key) {
  if (action === 'hit') {
    const j = await api(`/hit/${key}`, 'POST');
    return j && typeof j.value === 'number' ? j.value : null;
  }
  const j = await api(`/get?keys=${key}`);
  return j && typeof j[key] === 'number' ? j[key] : null;
}

// 端末ごとの記録（挑戦・完走は1端末1回だけ全体カウントに加算）

// ===== ゲーム進行 =====
const $ = (id) => document.getElementById(id);
let idx = 0;
let lastDeath = null;

function show(id) {
  ['title', 'stage', 'dead', 'clear'].forEach((s) => $(s).classList.toggle('hidden', s !== id));
  window.scrollTo(0, 0);
}

function deaths() { return Number(store.get('deaths') || 0); }

function renderMyDeaths() {
  const d = deaths();
  $('myDeaths').textContent = d ? `あなたの死亡回数：${d}回` : '';
}

async function loadStats() {
  const [p, c] = await Promise.all([counter('get', COUNTER.play), counter('get', COUNTER.clear)]);
  const play = p ?? 0, clear = c ?? 0;
  if (p === null && c === null) {
    ['sPlay', 'sClear', 'sRate'].forEach((id) => ($(id).textContent = '-'));
    return;
  }
  $('sPlay').textContent = play.toLocaleString();
  $('sClear').textContent = clear.toLocaleString();
  $('sRate').textContent = play ? `${((clear / play) * 100).toFixed(1)}%` : '-';
}

function start() {
  if (!store.get('played')) {
    store.set('played', '1');
    counter('hit', COUNTER.play);
  }
  idx = 0;
  $('okMsg').classList.add('hidden');
  renderStage();
  show('stage');
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderStage() {
  const s = STAGES[idx];
  $('tl').innerHTML = STAGES.map((_, i) => `<i class="${i < idx ? 'done' : i === idx ? 'now' : ''}"></i>`).join('');
  $('stYear').textContent = s.year;
  $('stAge').textContent = s.age;
  $('stTitle').textContent = s.title;
  $('stNarr').textContent = s.narr;
  $('stQ').textContent = s.q;
  const box = $('opts');
  box.innerHTML = '';
  shuffle(s.a).forEach((opt) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt[0];
    b.onclick = () => choose(opt);
    box.appendChild(b);
  });
  window.scrollTo(0, 0);
}

function choose([, correct, cause, text]) {
  const s = STAGES[idx];
  if (!correct) return die(s, cause, text);
  idx++;
  if (idx >= STAGES.length) return clear();
  $('okMsg').textContent = `✔ ${s.ok}`;
  $('okMsg').classList.remove('hidden');
  renderStage();
}

function die(s, cause, text) {
  store.set('deaths', String(deaths() + 1));
  lastDeath = { stage: s, cause, n: idx + 1 };
  $('dYear').textContent = `${s.year}・${s.title}`;
  $('dCause').textContent = cause;
  $('dText').textContent = text;
  $('dReached').textContent = `到達：${idx + 1} / ${STAGES.length} ステージ　｜　あなたの死亡回数：${deaths()}回`;
  show('dead');
}

async function clear() {
  show('clear');
  $('cDeaths').textContent = `完走までの死亡回数：${deaths()}回`;
  let rank = store.get('rank');
  if (!rank) {
    $('cRank').textContent = '…';
    const v = await counter('hit', COUNTER.clear);
    if (v !== null) { rank = String(v); store.set('rank', rank); }
  }
  $('cRank').textContent = rank ? Number(rank).toLocaleString() : '';
  $('cRankP').classList.toggle('hidden', !rank);
}

function pageUrl() { return location.origin + location.pathname; }

function tweet(text) {
  const u = new URL('https://twitter.com/intent/tweet');
  u.searchParams.set('text', text);
  u.searchParams.set('url', pageUrl());
  u.searchParams.set('hashtags', HASHTAGS.join(','));
  window.open(u.toString(), '_blank', 'noopener');
}

$('startBtn').onclick = start;
$('retryBtn').onclick = start;
$('againBtn').onclick = start;
$('shareDead').onclick = () => {
  const d = lastDeath;
  tweet(`織田信長として生きたら、${d.stage.year}「${d.stage.title}」で死にました💀\n死因：${d.cause}\n（${d.n}/${STAGES.length}ステージ・通算${deaths()}回死亡）\n\nあなたは本能寺までたどり着ける？`);
};
$('shareClear').onclick = () => {
  const r = store.get('rank');
  tweet(`織田信長の一生を完走しました🔥${r ? `\n${Number(r).toLocaleString()}人目の完走者！` : ''}\n（死亡回数：${deaths()}回）\n\n是非に及ばず。あなたは完走できる？`);
};

renderMyDeaths();
loadStats();
</script>
</body>
