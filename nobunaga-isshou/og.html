<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #fff4e2; font-family: "M PLUS Rounded 1c", sans-serif; color: #2b2118; position: relative; }
  #art { position: absolute; right: 0; top: 0; width: 600px; height: 630px; }
  #art svg { width: 100%; height: 100%; }
  .txt { position: absolute; left: 70px; top: 110px; width: 560px; }
  .k { display: inline-block; background: #2b2118; color: #fff; font-size: 34px; padding: 4px 22px; border-radius: 99px; }
  h1 { font-family: "Dela Gothic One", sans-serif; font-weight: 400; font-size: 96px; line-height: 1.15; margin: 22px 0 0; }
  h1 span { color: #e63b2e; }
  p { font-size: 36px; margin: 24px 0 0; color: #7a6a5c; }
</style>
</head>
<body>
  <div id="art"></div>
  <div class="txt">
    <span class="k">1問ミスで即死!?</span>
    <h1>織田信長の<br><span>一生クイズ</span></h1>
    <p>本能寺まで生き残れるか？</p>
  </div>
<script>
fetch('index.html').then(r => r.text()).then(t => {
  const js = t.split('<script>')[1].split('// ===== ゲーム進行')[0];
  const s = document.createElement('script'); s.textContent = js; document.body.appendChild(s);
  const svg = sceneSVG('title').replace('viewBox="0 0 400 220"', 'viewBox="190 0 210 220" preserveAspectRatio="xMidYMid slice"');
  document.getElementById('art').innerHTML = svg;
});
</script>
</body>
</html>
