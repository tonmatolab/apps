<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f6efe6; font-family: "M PLUS Rounded 1c", sans-serif; color: #3b2a20; display: flex; align-items: center; justify-content: center; }
  .box { width: 1100px; height: 530px; background: #fffaf4; border: 3px solid #e6d8c8; border-radius: 40px; display: flex; align-items: center; gap: 48px; padding: 0 80px; box-sizing: border-box; }
  .emoji { font-size: 220px; }
  h1 { font-size: 84px; font-weight: 800; margin: 0; line-height: 1.2; }
  p { font-size: 40px; color: #b5652d; margin: 20px 0 0; font-weight: 800; }
  small { display: block; font-size: 30px; color: #8a7262; margin-top: 16px; }
</style>
</head>
<body>
  <div class="box">
    <div class="emoji">☕</div>
    <div>
      <h1>コーヒー<br>タイプ診断</h1>
      <p>あなたにぴったりの1杯は？</p>
      <small>8問・約1分で診断</small>
    </div>
  </div>
</body>
</html>
