<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f3ece0; color: #2b2420; position: relative; font-family: "M PLUS Rounded 1c", sans-serif; }
  .txt { position: absolute; left: 64px; top: 70px; }
  .k { display: inline-block; background: #1f7a4d; color: #fff; font-size: 34px; padding: 4px 24px; border-radius: 99px; }
  h1 { font-family: "Dela Gothic One", sans-serif; font-weight: 400; font-size: 104px; line-height: 1.12; margin: 18px 0 0; }
  p { font-size: 34px; margin: 14px 0 0; color: #8a5a2b; }
  .code { display: flex; gap: 12px; margin-top: 24px; }
  .code b { width: 70px; height: 86px; display: grid; place-items: center; background: #fff; border-radius: 16px; border: 3px solid #e4d8c6; box-shadow: 0 5px 0 #e4d8c6;
    font-family: "Dela Gothic One", sans-serif; font-weight: 400; font-size: 52px; color: #1f7a4d; }
  .frame { position: absolute; right: 56px; top: 85px; width: 440px; height: 440px; background: #8a5a2b; border-radius: 26px; padding: 14px; box-shadow: 0 10px 0 #6b4420; transform: rotate(4deg); }
  .board { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; background: #155c39; border-radius: 12px; overflow: hidden; }
  .board div { background: #1f7a4d; display: grid; place-items: center; }
  .board i { width: 80%; height: 80%; border-radius: 50%; }
  .board i.b { background: radial-gradient(circle at 35% 30%, #555, #111 60%); }
  .board i.w { background: radial-gradient(circle at 35% 30%, #fff, #ddd 70%); }
</style>
</head>
<body>
  <div class="txt">
    <span class="k">登録なし・無料</span>
    <h1>リバーシ<br>部屋</h1>
    <p>合言葉を送るだけで友達と対戦</p>
    <div class="code"><b>4</b><b>8</b><b>8</b><b>4</b></div>
  </div>
  <div class="frame"><div class="board" id="b"></div></div>
  <script>
    const s = '................' + '..w.....' + '..wwb...' + '..bwbb..' + '...bw...' + '..w.....' + '................'.slice(0, 16);
    const el = document.getElementById('b');
    for (let i = 0; i < 64; i++) { const c = s[i] || '.'; el.insertAdjacentHTML('beforeend', `<div>${c === '.' ? '' : `<i class="${c === 'w' ? 'w' : 'b'}"></i>`}</div>`); }
  </script>
</body>
</html>
